service: network
rules:
  - id: NETWORK_HUAWEI_VRP_IF_LINK_DOWN
    signal_key: network_huawei_vrp_if_link_down
    level: critical
    description: Huawei VRP interface/link state transitioned to down.
    tags: [vendor, huawei, vrp, cloudengine, netengine, physical, link]
    condition:
      or:
        - field: message
          op: regex
          value: '(IFNET/4/(IF_STATE|LINK_STATE)).*(down state|turned into down|entered down|state to down)'
        - field: msg
          op: regex
          value: '(IFNET/4/(IF_STATE|LINK_STATE)).*(down state|turned into down|entered down|state to down)'

  - id: NETWORK_HUAWEI_VRP_BGP_PEER_DOWN
    signal_key: network_huawei_vrp_bgp_peer_down
    level: critical
    description: Huawei VRP BGP peer changed from established toward non-established state.
    tags: [vendor, huawei, vrp, cloudengine, netengine, bgp, control_plane]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: 'BGP/3/STATE_CHG_UPDOWN'
            - field: msg
              op: regex
              value: 'BGP/3/STATE_CHG_UPDOWN'
        - or:
            - field: message
              op: regex
              value: '(changed from .* to .*(idle|active|connect|down)|StateChangeReason=.*(hold|error|reset|cease|down)|to \[(0|1|2|3)\])'
            - field: msg
              op: regex
              value: '(changed from .* to .*(idle|active|connect|down)|StateChangeReason=.*(hold|error|reset|cease|down)|to \[(0|1|2|3)\])'

  - id: NETWORK_HUAWEI_VRP_BFD_SESSION_DOWN
    signal_key: network_huawei_vrp_bfd_session_down
    level: critical
    description: Huawei VRP BFD session transitioned to down.
    tags: [vendor, huawei, vrp, cloudengine, netengine, bfd, control_plane]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: '(BFD/4/STACHG_TODWN|BFD/4/SESSIONDOWN)'
            - field: msg
              op: regex
              value: '(BFD/4/STACHG_TODWN|BFD/4/SESSIONDOWN)'
        - or:
            - field: message
              op: regex
              value: '(NeighborIp=|InterfaceName=|DownReason=|session changed from up to down)'
            - field: msg
              op: regex
              value: '(NeighborIp=|InterfaceName=|DownReason=|session changed from up to down)'

  - id: NETWORK_HUAWEI_VRP_OSPF_NEIGHBOR_DOWN
    signal_key: network_huawei_vrp_ospf_neighbor_down
    level: critical
    description: Huawei VRP OSPF neighbor changed via down/dead/inactive events.
    tags: [vendor, huawei, vrp, cloudengine, netengine, ospf, control_plane]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: 'OSPF/(4|6)/NBR_CHANGE(_E)?'
            - field: msg
              op: regex
              value: 'OSPF/(4|6)/NBR_CHANGE(_E)?'
        - or:
            - field: message
              op: regex
              value: '(NbrEvent=(7|9|12|13)|inactivity|1-way|lldown|to down|neighbor.*down)'
            - field: msg
              op: regex
              value: '(NbrEvent=(7|9|12|13)|inactivity|1-way|lldown|to down|neighbor.*down)'

  - id: NETWORK_HUAWEI_VRP_VRRP_STATE_WARNING
    signal_key: network_huawei_vrp_vrrp_state_warning
    level: warning
    description: Huawei VRP VRRP state warning/trap indicating potential failover instability.
    tags: [vendor, huawei, vrp, cloudengine, netengine, vrrp, availability]
    condition:
      or:
        - field: message
          op: regex
          value: 'VRRP/4/(STATEWARNINGEXTEND|vrrpTrapNonMaster|vrrpMasterDown)'
        - field: msg
          op: regex
          value: 'VRRP/4/(STATEWARNINGEXTEND|vrrpTrapNonMaster|vrrpMasterDown)'

  - id: NETWORK_HUAWEI_VRP_LACP_MEMBER_NOT_SELECTED
    signal_key: network_huawei_vrp_lacp_member_not_selected
    level: warning
    description: Huawei VRP LACP reports member port negotiation/select failure.
    tags: [vendor, huawei, vrp, cloudengine, netengine, lacp, layer2]
    condition:
      or:
        - field: message
          op: regex
          value: 'LACP/(3|4)/(LAG_DOWN_REASON_EVENT|LAG_DOWN_REASON_PDU|hwLacpNegotiateFailed_active)'
        - field: msg
          op: regex
          value: 'LACP/(3|4)/(LAG_DOWN_REASON_EVENT|LAG_DOWN_REASON_PDU|hwLacpNegotiateFailed_active)'

  - id: NETWORK_HUAWEI_VRP_STP_BPDU_PROTECTION
    signal_key: network_huawei_vrp_stp_bpdu_protection
    level: critical
    description: Huawei VRP BPDU protection triggered and blocked a port.
    tags: [vendor, huawei, vrp, cloudengine, netengine, stp, layer2]
    condition:
      or:
        - field: message
          op: contains
          value: MSTP/4/BPDU_PROTECTION
        - field: msg
          op: contains
          value: MSTP/4/BPDU_PROTECTION

  - id: NETWORK_HUAWEI_VRP_STP_TOPOLOGY_ANOMALY
    signal_key: network_huawei_vrp_stp_topology_anomaly
    level: warning
    description: Huawei VRP spanning-tree topology anomaly or instability event.
    tags: [vendor, huawei, vrp, cloudengine, netengine, stp, layer2]
    condition:
      or:
        - field: message
          op: regex
          value: 'MSTP/4/(ROOT_LOST|RECEIVE_MSTITC|SET_PORT_DISCARDING|TCN_RECEIVED)'
        - field: msg
          op: regex
          value: 'MSTP/4/(ROOT_LOST|RECEIVE_MSTITC|SET_PORT_DISCARDING|TCN_RECEIVED)'

  - id: NETWORK_HUAWEI_VRP_CPU_USAGE_HIGH
    signal_key: network_huawei_vrp_cpu_usage_high
    level: warning
    description: Huawei VRP CPU usage crossed configured high threshold.
    tags: [vendor, huawei, vrp, cloudengine, netengine, cpu, resource]
    condition:
      or:
        - field: message
          op: regex
          value: '((VOSCPU|CPUP)/4/CPU_USAGE_HIGH|ENTITYTRAP/4/ENTITYCPUALARM|SYSTEM/1/hwCPUUtilizationRisingAlarm_active)'
        - field: msg
          op: regex
          value: '((VOSCPU|CPUP)/4/CPU_USAGE_HIGH|ENTITYTRAP/4/ENTITYCPUALARM|SYSTEM/1/hwCPUUtilizationRisingAlarm_active)'

  - id: NETWORK_HUAWEI_VRP_TEMPERATURE_ALARM
    signal_key: network_huawei_vrp_temperature_alarm
    level: critical
    description: Huawei VRP board/environment temperature alarm is active.
    tags: [vendor, huawei, vrp, cloudengine, netengine, hardware, thermal]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: '(ENTITYTRAP/4/(ENTITYBRDTEMPALARM|hwBoardTemperatureRising_alarm)|ALML/4/TEMPHIGH)'
            - field: msg
              op: regex
              value: '(ENTITYTRAP/4/(ENTITYBRDTEMPALARM|hwBoardTemperatureRising_alarm)|ALML/4/TEMPHIGH)'
        - or:
            - field: message
              op: not_regex
              value: '(RESUME|FALLING|CLEAR|NORMAL)'
            - field: msg
              op: not_regex
              value: '(RESUME|FALLING|CLEAR|NORMAL)'

  - id: NETWORK_HUAWEI_VRP_POWER_INVALID
    signal_key: network_huawei_vrp_power_invalid
    level: critical
    description: Huawei VRP power supply state is invalid or abnormal.
    tags: [vendor, huawei, vrp, cloudengine, netengine, hardware, power]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: '(ALML/4/POWERINVALID|ENTITYTRAP/4/hwPowerStateAbnormal_alarm)'
            - field: msg
              op: regex
              value: '(ALML/4/POWERINVALID|ENTITYTRAP/4/hwPowerStateAbnormal_alarm)'
        - or:
            - field: message
              op: not_regex
              value: '(RESUME|NORMAL|RECOVERY)'
            - field: msg
              op: not_regex
              value: '(RESUME|NORMAL|RECOVERY)'

  - id: NETWORK_HUAWEI_VRP_LOGIN_FAILURE
    signal_key: network_huawei_vrp_login_failure
    level: warning
    description: Huawei VRP login/authentication failure detected on management plane.
    tags: [vendor, huawei, vrp, cloudengine, netengine, aaa, authentication]
    condition:
      or:
        - field: message
          op: regex
          value: '(SSH/4/(SSH_FAIL|USER_NOTEXIST)|SHELL/4/(LOGIN_FAIL_FOR_INPUT_TIMEOUT|LOGIN_FAILED|LOGINFAIL)|AAA/4/(AUTHEN_FAIL|LOGIN_FAIL)|LOGIN/4/LOGINFAILED)'
        - field: msg
          op: regex
          value: '(SSH/4/(SSH_FAIL|USER_NOTEXIST)|SHELL/4/(LOGIN_FAIL_FOR_INPUT_TIMEOUT|LOGIN_FAILED|LOGINFAIL)|AAA/4/(AUTHEN_FAIL|LOGIN_FAIL)|LOGIN/4/LOGINFAILED)'

  - id: NETWORK_HUAWEI_VRP_COMMAND_AUDIT
    signal_key: network_huawei_vrp_command_audit
    level: info
    description: Huawei VRP command execution/audit record.
    tags: [vendor, huawei, vrp, cloudengine, netengine, config_change, audit]
    condition:
      or:
        - field: message
          op: regex
          value: 'SHELL/5/CMDRECORD(_V2)?'
        - field: msg
          op: regex
          value: 'SHELL/5/CMDRECORD(_V2)?'
