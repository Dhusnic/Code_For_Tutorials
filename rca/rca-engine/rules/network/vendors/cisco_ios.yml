service: network
rules:
  - id: NETWORK_CISCO_IOS_LINK_UPDOWN
    signal_key: network_cisco_ios_link_updown
    level: critical
    description: Cisco IOS reported interface/link transition to down.
    tags: [vendor, cisco, ios, physical, link]
    condition:
      or:
        - field: message
          op: regex
          value: '%LINK-[0-9]-UPDOWN:.*(down|notconnect|administratively down)'
        - field: msg
          op: regex
          value: '%LINK-[0-9]-UPDOWN:.*(down|notconnect|administratively down)'
        - field: message
          op: regex
          value: '%LINEPROTO-[0-9]-UPDOWN:.*(down|notconnect|administratively down)'
        - field: msg
          op: regex
          value: '%LINEPROTO-[0-9]-UPDOWN:.*(down|notconnect|administratively down)'

  - id: NETWORK_CISCO_IOS_BGP_ADJCHANGE_DOWN
    signal_key: network_cisco_ios_bgp_adjchange_down
    level: critical
    description: Cisco IOS BGP adjacency changed to down.
    tags: [vendor, cisco, ios, bgp, control_plane]
    condition:
      or:
        - field: message
          op: regex
          value: '%BGP-[0-9]-ADJCHANGE:.*(Down|Idle|reset|hold time expired|notification sent)'
        - field: msg
          op: regex
          value: '%BGP-[0-9]-ADJCHANGE:.*(Down|Idle|reset|hold time expired|notification sent)'

  - id: NETWORK_CISCO_IOS_OSPF_ADJCHANGE_DOWN
    signal_key: network_cisco_ios_ospf_adjchange_down
    level: critical
    description: Cisco IOS OSPF neighbor adjacency changed to degraded or down state.
    tags: [vendor, cisco, ios, ospf, control_plane]
    condition:
      or:
        - field: message
          op: regex
          value: '%OSPF-[0-9]-ADJCHG:.*(down|FULL to|LOADING to|EXSTART to|2WAY to)'
        - field: msg
          op: regex
          value: '%OSPF-[0-9]-ADJCHG:.*(down|FULL to|LOADING to|EXSTART to|2WAY to)'

  - id: NETWORK_CISCO_IOS_BFD_SESSION_DOWN
    signal_key: network_cisco_ios_bfd_session_down
    level: critical
    description: Cisco IOS BFD session transitioned down.
    tags: [vendor, cisco, ios, bfd, control_plane]
    condition:
      and:
        - or:
            - field: message
              op: contains
              value: BFD
            - field: msg
              op: contains
              value: BFD
        - or:
            - field: message
              op: regex
              value: '(down|session down|neighbor down|timed out)'
            - field: msg
              op: regex
              value: '(down|session down|neighbor down|timed out)'

  - id: NETWORK_CISCO_IOS_MALLOCFAIL
    signal_key: network_cisco_ios_mallocfail
    level: critical
    description: Cisco IOS memory allocation failure detected.
    tags: [vendor, cisco, ios, memory, resource]
    condition:
      or:
        - field: message
          op: contains
          value: '%SYS-2-MALLOCFAIL'
        - field: msg
          op: contains
          value: '%SYS-2-MALLOCFAIL'

  - id: NETWORK_CISCO_IOS_CPU_HOG
    signal_key: network_cisco_ios_cpu_hog
    level: critical
    description: Cisco IOS process is hogging CPU and may impact control plane.
    tags: [vendor, cisco, ios, cpu, resource]
    condition:
      or:
        - field: message
          op: contains
          value: CPUHOG
        - field: msg
          op: contains
          value: CPUHOG

  - id: NETWORK_CISCO_IOS_ERRDISABLE
    signal_key: network_cisco_ios_errdisable
    level: warning
    description: Cisco IOS interface entered err-disable state.
    tags: [vendor, cisco, ios, interface, stability]
    condition:
      or:
        - field: message
          op: regex
          value: '(ERR_DISABLE|err-disable|errdisable)'
        - field: msg
          op: regex
          value: '(ERR_DISABLE|err-disable|errdisable)'

  - id: NETWORK_CISCO_IOS_LOGIN_FAILED
    signal_key: network_cisco_ios_login_failed
    level: warning
    description: Cisco IOS login authentication failed.
    tags: [vendor, cisco, ios, aaa, authentication]
    condition:
      and:
        - or:
            - field: message
              op: contains
              value: SEC_LOGIN
            - field: msg
              op: contains
              value: SEC_LOGIN
        - or:
            - field: message
              op: contains
              value: LOGIN_FAILED
            - field: msg
              op: contains
              value: LOGIN_FAILED

  - id: NETWORK_CISCO_IOS_CONFIG_CHANGE
    signal_key: network_cisco_ios_config_change
    level: info
    description: Cisco IOS configuration change detected.
    tags: [vendor, cisco, ios, config_change, audit]
    condition:
      or:
        - field: message
          op: contains
          value: '%SYS-5-CONFIG_I'
        - field: msg
          op: contains
          value: '%SYS-5-CONFIG_I'

  - id: NETWORK_CISCO_IOS_CONFIG_FAILED
    signal_key: network_cisco_ios_config_failed
    level: critical
    description: Cisco IOS configuration apply/parse failed.
    tags: [vendor, cisco, ios, config_change]
    condition:
      or:
        - field: message
          op: regex
          value: '(Invalid input detected|ambiguous command|configuration failed|rollback)'
        - field: msg
          op: regex
          value: '(Invalid input detected|ambiguous command|configuration failed|rollback)'

  - id: NETWORK_CISCO_IOS_ENV_ALARM
    signal_key: network_cisco_ios_env_alarm
    level: critical
    description: Cisco IOS environmental or hardware alarm event.
    tags: [vendor, cisco, ios, hardware, thermal, power]
    condition:
      or:
        - field: message
          op: regex
          value: '%(ENVMON|PLATFORM|PWR|PM)-[0-9]-.*(FAIL|FAULT|ALARM|shutdown|overtemperature)'
        - field: msg
          op: regex
          value: '%(ENVMON|PLATFORM|PWR|PM)-[0-9]-.*(FAIL|FAULT|ALARM|shutdown|overtemperature)'
