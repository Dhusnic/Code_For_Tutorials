service: network
rules:
  - id: NETWORK_CRONTAB_CRON_CMD_STARTED
    signal_key: network_crontab_cron_cmd_started
    level: info
    description: CRON/CROND started executing a scheduled command.
    tags: [vendor, crontab, cron, crond, linux, scheduler, execution, audit]
    condition:
      or:
        - field: message
          op: regex
          value: '(\bCRON(D)?\[[0-9]+\]:\s*)?\([^)]+\)\s+CMD\s+\(.+\)'
        - field: msg
          op: regex
          value: '(\bCRON(D)?\[[0-9]+\]:\s*)?\([^)]+\)\s+CMD\s+\(.+\)'

  - id: NETWORK_CRONTAB_CRON_CMD_COMPLETED
    signal_key: network_crontab_cron_cmd_completed
    level: info
    description: CRON/CROND finished a scheduled command.
    tags: [vendor, crontab, cron, crond, linux, scheduler, execution, audit]
    condition:
      or:
        - field: message
          op: regex
          value: '(\bCRON(D)?\[[0-9]+\]:\s*)?\([^)]+\)\s+END\s+\(.+\)'
        - field: msg
          op: regex
          value: '(\bCRON(D)?\[[0-9]+\]:\s*)?\([^)]+\)\s+END\s+\(.+\)'

  - id: NETWORK_CRONTAB_CRON_DAEMON_FORK_FAILURE
    signal_key: network_crontab_cron_daemon_fork_failure
    level: critical
    description: CRON daemon failed to fork a child process for job execution.
    tags: [vendor, crontab, cron, crond, linux, scheduler, process, failure]
    condition:
      or:
        - field: message
          op: regex
          value: '(\(CRON\)|\bCRON(D)?\[[0-9]+\]:).*(can''t fork|cannot fork)'
        - field: msg
          op: regex
          value: '(\(CRON\)|\bCRON(D)?\[[0-9]+\]:).*(can''t fork|cannot fork)'

  - id: NETWORK_CRONTAB_CRON_PRIVILEGE_DROP_FAILURE
    signal_key: network_crontab_cron_privilege_drop_failure
    level: critical
    description: CRON failed to drop privileges or initialize groups before exec.
    tags: [vendor, crontab, cron, crond, linux, security, privilege, failure]
    condition:
      or:
        - field: message
          op: regex
          value: 'do_command:(setgid|setuid|initgroups)\([0-9]+\) failed'
        - field: msg
          op: regex
          value: 'do_command:(setgid|setuid|initgroups)\([0-9]+\) failed'

  - id: NETWORK_CRONTAB_CRON_NO_MTA_OUTPUT_DISCARDED
    signal_key: network_crontab_cron_no_mta_output_discarded
    level: warning
    description: CRON dropped job output because no local MTA was available.
    tags: [vendor, crontab, cron, crond, linux, scheduler, mail, observability]
    condition:
      or:
        - field: message
          op: contains
          value: No MTA installed, discarding output
        - field: msg
          op: contains
          value: No MTA installed, discarding output

  - id: NETWORK_CRONTAB_CRON_MAIL_DELIVERY_FAILURE
    signal_key: network_crontab_cron_mail_delivery_failure
    level: warning
    description: CRON attempted to mail job output but delivery or stream read failed.
    tags: [vendor, crontab, cron, crond, linux, scheduler, mail, failure]
    condition:
      or:
        - field: message
          op: regex
          value: '(mailed [0-9]+ byte(s)? of output but got status 0x[0-9a-fA-F]+ from MTA|stream error reading output)'
        - field: msg
          op: regex
          value: '(mailed [0-9]+ byte(s)? of output but got status 0x[0-9a-fA-F]+ from MTA|stream error reading output)'

  - id: NETWORK_CRONTAB_CRONTAB_SYNTAX_ERROR
    signal_key: network_crontab_crontab_syntax_error
    level: warning
    description: Crontab parser rejected an entry due to invalid schedule or format.
    tags: [vendor, crontab, cron, crond, linux, scheduler, parser, syntax]
    condition:
      or:
        - field: message
          op: regex
          value: '"?[^":]+"?:[0-9]+:\s*(bad minute|bad hour|bad day-of-month|bad month|bad day-of-week|bad command|bad time specifier|bad username|command too long)'
        - field: msg
          op: regex
          value: '"?[^":]+"?:[0-9]+:\s*(bad minute|bad hour|bad day-of-month|bad month|bad day-of-week|bad command|bad time specifier|bad username|command too long)'

  - id: NETWORK_CRONTAB_CRONTAB_INSTALL_REJECTED
    signal_key: network_crontab_crontab_install_rejected
    level: critical
    description: Crontab update was rejected and new schedule was not installed.
    tags: [vendor, crontab, cron, crond, linux, scheduler, install, failure]
    condition:
      or:
        - field: message
          op: regex
          value: '(errors in crontab file, can''t install|new crontab file is missing newline before EOF, can''t install)'
        - field: msg
          op: regex
          value: '(errors in crontab file, can''t install|new crontab file is missing newline before EOF, can''t install)'

  - id: NETWORK_CRONTAB_CRON_MISSING_NEWLINE_IGNORED
    signal_key: network_crontab_cron_missing_newline_ignored
    level: warning
    description: CRON daemon ignored a crontab because of missing trailing newline.
    tags: [vendor, crontab, cron, crond, linux, scheduler, parser, integrity]
    condition:
      or:
        - field: message
          op: regex
          value: 'ERROR\s+\(Missing newline before EOF, this crontab file will be ignored\)'
        - field: msg
          op: regex
          value: 'ERROR\s+\(Missing newline before EOF, this crontab file will be ignored\)'

  - id: NETWORK_CRONTAB_CRON_PAM_SESSION_OPENED
    signal_key: network_crontab_cron_pam_session_opened
    level: info
    description: PAM session opened for a CRON-triggered execution.
    tags: [vendor, crontab, cron, crond, linux, pam, authentication, audit]
    condition:
      or:
        - field: message
          op: regex
          value: 'pam_unix\(cron:session\):\s+session opened for user [^ ]+ by \(uid=[0-9]+\)'
        - field: msg
          op: regex
          value: 'pam_unix\(cron:session\):\s+session opened for user [^ ]+ by \(uid=[0-9]+\)'

  - id: NETWORK_CRONTAB_CRON_PAM_SESSION_CLOSED
    signal_key: network_crontab_cron_pam_session_closed
    level: info
    description: PAM session closed after a CRON-triggered execution.
    tags: [vendor, crontab, cron, crond, linux, pam, authentication, audit]
    condition:
      or:
        - field: message
          op: regex
          value: 'pam_unix\(cron:session\):\s+session closed for user [^ ]+'
        - field: msg
          op: regex
          value: 'pam_unix\(cron:session\):\s+session closed for user [^ ]+'

  - id: NETWORK_CRONTAB_CRON_PAM_AUTH_FAILURE
    signal_key: network_crontab_cron_pam_auth_failure
    level: warning
    description: CRON job authentication/account check failed in PAM.
    tags: [vendor, crontab, cron, crond, linux, pam, authentication, failure]
    condition:
      or:
        - field: message
          op: regex
          value: '(pam_unix\(cron:(auth|account)\):.*(authentication failure|user unknown|account expired)|FAILED to authorize user with PAM)'
        - field: msg
          op: regex
          value: '(pam_unix\(cron:(auth|account)\):.*(authentication failure|user unknown|account expired)|FAILED to authorize user with PAM)'
