service: network
rules:
  - id: NETWORK_ARUBA_AOS_PORT_OFFLINE
    signal_key: network_aruba_aos_port_offline
    level: critical
    description: HPE Aruba switch interface/port transitioned to offline/down state.
    tags: [vendor, hpe, aruba, aos, aoscx, aos_switch, physical, link]
    condition:
      or:
        - field: message
          op: regex
          value: 'port [A-Za-z0-9/:-]+ is now off-line'
        - field: msg
          op: regex
          value: 'port [A-Za-z0-9/:-]+ is now off-line'
        - field: message
          op: regex
          value: 'Link status for interface [A-Za-z0-9/._:-]+ is (down|DOWN)'
        - field: msg
          op: regex
          value: 'Link status for interface [A-Za-z0-9/._:-]+ is (down|DOWN)'
        - field: message
          op: regex
          value: 'Interface [A-Za-z0-9/._:-]+ encountered a hardware error that caused a link reset'
        - field: msg
          op: regex
          value: 'Interface [A-Za-z0-9/._:-]+ encountered a hardware error that caused a link reset'

  - id: NETWORK_ARUBA_AOS_BGP_PEER_DOWN
    signal_key: network_aruba_aos_bgp_peer_down
    level: critical
    description: HPE Aruba BGP peer/session is down or idled due to control-plane issue.
    tags: [vendor, hpe, aruba, aos, aoscx, aos_switch, bgp, control_plane]
    condition:
      or:
        - field: message
          op: regex
          value: '(Peer down\..*error-code:.*vrf-name:|BGP: Peer down|BGP: Peer timeout|BGP: Peer interface .* down|BGP: BGP route count from peer exceeded maximum allowable prefix limit.*Peer Ideled)'
        - field: msg
          op: regex
          value: '(Peer down\..*error-code:.*vrf-name:|BGP: Peer down|BGP: Peer timeout|BGP: Peer interface .* down|BGP: BGP route count from peer exceeded maximum allowable prefix limit.*Peer Ideled)'

  - id: NETWORK_ARUBA_AOS_BFD_SESSION_DEGRADED
    signal_key: network_aruba_aos_bfd_session_degraded
    level: warning
    description: HPE Aruba BFD session changed into an unhealthy/down state.
    tags: [vendor, hpe, aruba, aos, aoscx, aos_switch, bfd, control_plane]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: '(BFD session is down|BFD session is administratively down|BFD session is unidirectional|BFD session .* error|Session .* under .* changed to .*|Port .* can not forward BFD traffic)'
            - field: msg
              op: regex
              value: '(BFD session is down|BFD session is administratively down|BFD session is unidirectional|BFD session .* error|Session .* under .* changed to .*|Port .* can not forward BFD traffic)'
        - or:
            - field: message
              op: regex
              value: '(down|admin-down|administratively down|unidirectional|idle|error|fail|timed out)'
            - field: msg
              op: regex
              value: '(down|admin-down|administratively down|unidirectional|idle|error|fail|timed out)'

  - id: NETWORK_ARUBA_AOS_OSPF_ADJACENCY_CHANGE
    signal_key: network_aruba_aos_ospf_adjacency_change
    level: warning
    description: HPE Aruba OSPF adjacency changed and may indicate route-plane instability.
    tags: [vendor, hpe, aruba, aos, aoscx, aos_switch, ospf, control_plane]
    condition:
      or:
        - field: message
          op: regex
          value: '(AdjChg: Nbr .*->.*|ADJCHG: Neighbor .* moved from .* to .*|ADJCHG: Neighbor .* moved to .* - adj formed/lost)'
        - field: msg
          op: regex
          value: '(AdjChg: Nbr .*->.*|ADJCHG: Neighbor .* moved from .* to .*|ADJCHG: Neighbor .* moved to .* - adj formed/lost)'

  - id: NETWORK_ARUBA_AOS_LACP_TRUNK_OFFLINE
    signal_key: network_aruba_aos_lacp_trunk_offline
    level: warning
    description: HPE Aruba LACP/LAG transitioned into degraded, out-of-sync, or offline state.
    tags: [vendor, hpe, aruba, aos, aoscx, aos_switch, lacp, layer2]
    condition:
      or:
        - field: message
          op: regex
          value: '(Partner is out of sync for interface .* LAG .*|Partner is lost \(timed out\) for interface .* LAG .*|Dynamic LACP trunk .* is now off-line|No Trunks Available|cannot be part of Lag .* Speed mismatched)'
        - field: msg
          op: regex
          value: '(Partner is out of sync for interface .* LAG .*|Partner is lost \(timed out\) for interface .* LAG .*|Dynamic LACP trunk .* is now off-line|No Trunks Available|cannot be part of Lag .* Speed mismatched)'

  - id: NETWORK_ARUBA_AOS_STP_TOPOLOGY_ANOMALY
    signal_key: network_aruba_aos_stp_topology_anomaly
    level: warning
    description: HPE Aruba STP/RPVST reported BPDU protection, starvation, or topology churn.
    tags: [vendor, hpe, aruba, aos, aoscx, aos_switch, stp, layer2]
    condition:
      or:
        - field: message
          op: regex
          value: '(Port .* disabled - BPDU received on protected port|RPVST - Root changed from|Root port changed from .* to .* on VLAN|Topology change received on port|Topology change generated on port|Starved for a BPDU on port|Received a BPDU having inconsistent|Root changed from)'
        - field: msg
          op: regex
          value: '(Port .* disabled - BPDU received on protected port|RPVST - Root changed from|Root port changed from .* to .* on VLAN|Topology change received on port|Topology change generated on port|Starved for a BPDU on port|Received a BPDU having inconsistent|Root changed from)'

  - id: NETWORK_ARUBA_AOS_CHASSIS_FAN_OR_POWER_FAILURE
    signal_key: network_aruba_aos_chassis_fan_or_power_failure
    level: critical
    description: HPE Aruba chassis reported fan, PSU, or thermal-protection failure.
    tags: [vendor, hpe, aruba, aos, aoscx, aos_switch, hardware, fan, power]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: '(PSU .*: Fan-.*|PSU .* sensor .* threshold limit|PSU .* has shutdown due to over temperature|fan tray .* unsupported|fan tray .* disabled|fan tray .* incorrectly programmed|Fan .*Failure|Power Supply .*Failure|Hotswap Failure|power supply)'
            - field: msg
              op: regex
              value: '(PSU .*: Fan-.*|PSU .* sensor .* threshold limit|PSU .* has shutdown due to over temperature|fan tray .* unsupported|fan tray .* disabled|fan tray .* incorrectly programmed|Fan .*Failure|Power Supply .*Failure|Hotswap Failure|power supply)'
        - or:
            - field: message
              op: not_regex
              value: '(status .*OK|WITHIN the threshold value|back to safe temperature|safe temperature)'
            - field: msg
              op: not_regex
              value: '(status .*OK|WITHIN the threshold value|back to safe temperature|safe temperature)'

  - id: NETWORK_ARUBA_AOS_TEMPERATURE_THRESHOLD
    signal_key: network_aruba_aos_temperature_threshold
    level: critical
    description: HPE Aruba system or PSU temperature exceeded operational threshold.
    tags: [vendor, hpe, aruba, aos, aoscx, aos_switch, hardware, thermal]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: '(Over-temperature for sensor|critical temperature|Ambient temperature .* above|System power temperature .*threshold value|PoE power temperature .*threshold value|temperature alarm|shutdown due to over temperature)'
            - field: msg
              op: regex
              value: '(Over-temperature for sensor|critical temperature|Ambient temperature .* above|System power temperature .*threshold value|PoE power temperature .*threshold value|temperature alarm|shutdown due to over temperature)'
        - or:
            - field: message
              op: regex
              value: '(EXCEEDS|high|critical|shutdown|over-temperature|above)'
            - field: msg
              op: regex
              value: '(EXCEEDS|high|critical|shutdown|over-temperature|above)'

  - id: NETWORK_ARUBA_AOS_LOGIN_FAILURE
    signal_key: network_aruba_aos_login_failure
    level: warning
    description: HPE Aruba management or access-control authentication failed.
    tags: [vendor, hpe, aruba, aoscx, aos, aaa, authentication]
    condition:
      or:
        - field: message
          op: regex
          value: '(Event\\|13002\\|LOG_ERR\\|CDTR\\|.*session has failed|login from .* for CONSOLE session has failed|Authentication failed with reason .* for client|login .* has failed|authentication failed)'
        - field: msg
          op: regex
          value: '(Event\\|13002\\|LOG_ERR\\|CDTR\\|.*session has failed|login from .* for CONSOLE session has failed|Authentication failed with reason .* for client|login .* has failed|authentication failed)'

  - id: NETWORK_ARUBA_AOS_CENTRAL_CONNECTIVITY_FAILURE
    signal_key: network_aruba_aos_central_connectivity_failure
    level: warning
    description: HPE Aruba device failed to connect/disconnected from HPE Aruba Networking Central.
    tags: [vendor, hpe, aruba, aoscx, aos, management, telemetry]
    condition:
      or:
        - field: message
          op: regex
          value: '(Event\\|4640\\|LOG_ERR\\|AMM\\|.*Failed to connect to (Aruba Central|HPE Aruba Networking Central)|Failed to connect to (Aruba Central|HPE Aruba Networking Central) on location .* on VRF .* with Source IP|connection to (Aruba Central|HPE Aruba Networking Central) is disconnected|Waiting for (Aruba Central|HPE Aruba Networking Central) location)'
        - field: msg
          op: regex
          value: '(Event\\|4640\\|LOG_ERR\\|AMM\\|.*Failed to connect to (Aruba Central|HPE Aruba Networking Central)|Failed to connect to (Aruba Central|HPE Aruba Networking Central) on location .* on VRF .* with Source IP|connection to (Aruba Central|HPE Aruba Networking Central) is disconnected|Waiting for (Aruba Central|HPE Aruba Networking Central) location)'

  - id: NETWORK_ARUBA_AOS_MODULE_REBOOT
    signal_key: network_aruba_aos_module_reboot
    level: critical
    description: HPE Aruba module rebooted due to reset, crash, or watchdog condition.
    tags: [vendor, hpe, aruba, aoscx, aos, lifecycle, crash]
    condition:
      or:
        - field: message
          op: regex
          value: '(Module rebooted\\. Reason|CPU request reset|Boot-ID|system restarted|watchdog reset)'
        - field: msg
          op: regex
          value: '(Module rebooted\\. Reason|CPU request reset|Boot-ID|system restarted|watchdog reset)'
