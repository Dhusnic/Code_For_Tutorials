service: network
rules:
  - id: NETWORK_CHECKPOINT_TRAFFIC_DROP
    signal_key: network_checkpoint_traffic_drop
    level: critical
    description: Check Point firewall dropped traffic by policy.
    tags: [vendor, checkpoint, firewall, security_policy]
    condition:
      or:
        - field: message
          op: regex
          value: '(action=Drop|action=\"Drop\")'
        - field: msg
          op: regex
          value: '(action=Drop|action=\"Drop\")'

  - id: NETWORK_CHECKPOINT_TRAFFIC_REJECT
    signal_key: network_checkpoint_traffic_reject
    level: warning
    description: Check Point firewall rejected traffic.
    tags: [vendor, checkpoint, firewall, security_policy]
    condition:
      or:
        - field: message
          op: regex
          value: '(action=Reject|action=\"Reject\")'
        - field: msg
          op: regex
          value: '(action=Reject|action=\"Reject\")'

  - id: NETWORK_CHECKPOINT_VPN_TUNNEL_DOWN
    signal_key: network_checkpoint_vpn_tunnel_down
    level: critical
    description: Check Point VPN tunnel down or negotiation failure detected.
    tags: [vendor, checkpoint, vpn, availability]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: '\b(vpn|ipsec|ike)\b'
            - field: msg
              op: regex
              value: '\b(vpn|ipsec|ike)\b'
        - or:
            - field: message
              op: regex
              value: '(down|failed|timeout|expired|phase 1 failed|phase 2 failed)'
            - field: msg
              op: regex
              value: '(down|failed|timeout|expired|phase 1 failed|phase 2 failed)'

  - id: NETWORK_CHECKPOINT_POLICY_INSTALL_FAILED
    signal_key: network_checkpoint_policy_install_failed
    level: critical
    description: Check Point policy installation failed.
    tags: [vendor, checkpoint, policy, config_change]
    condition:
      or:
        - field: message
          op: regex
          value: '(policy install failed|install policy failed|Policy installation failed)'
        - field: msg
          op: regex
          value: '(policy install failed|install policy failed|Policy installation failed)'

  - id: NETWORK_CHECKPOINT_CLUSTER_MEMBER_DOWN
    signal_key: network_checkpoint_cluster_member_down
    level: critical
    description: Check Point ClusterXL member or state degraded.
    tags: [vendor, checkpoint, cluster, availability]
    condition:
      and:
        - or:
            - field: message
              op: regex
              value: '(ClusterXL|cluster)'
            - field: msg
              op: regex
              value: '(ClusterXL|cluster)'
        - or:
            - field: message
              op: regex
              value: '(member down|failover|state change|active to standby|standby to down)'
            - field: msg
              op: regex
              value: '(member down|failover|state change|active to standby|standby to down)'

  - id: NETWORK_CHECKPOINT_LOG_EXPORTER_ERROR
    signal_key: network_checkpoint_log_exporter_error
    level: warning
    description: Check Point Log Exporter encountered errors or disconnects.
    tags: [vendor, checkpoint, logging, exporter]
    condition:
      and:
        - or:
            - field: message
              op: contains
              value: cpLogExporter
            - field: msg
              op: contains
              value: cpLogExporter
        - or:
            - field: message
              op: regex
              value: '(error|failed|disconnect|retry)'
            - field: msg
              op: regex
              value: '(error|failed|disconnect|retry)'

  - id: NETWORK_CHECKPOINT_CONFIG_CHANGE
    signal_key: network_checkpoint_config_change
    level: info
    description: Check Point configuration or policy update detected.
    tags: [vendor, checkpoint, config_change, audit]
    condition:
      or:
        - field: message
          op: regex
          value: '(policy installed successfully|configuration changed|rulebase installed)'
        - field: msg
          op: regex
          value: '(policy installed successfully|configuration changed|rulebase installed)'
