input {
    pipeline {
        address => "linux_pipeline_135098068173316952064"
    }
}

filter {
    ruby {
        init => 'require "securerandom"'
        code => '
            source_rca_id = event.get("source_rca_id")
            if source_rca_id.nil? || source_rca_id.to_s.strip.empty?
                event.set("source_rca_id", SecureRandom.uuid)
            end
        '
    }

    mutate {
        add_field => { "[event][child_pipeline]" => "135098106316384636928" }
    }

    ruby {
        path => "/etc/logstash/scripts/signal_rule_matcher.rb"
        script_params => {
            "rules_root" => "/etc/logstash/rules"
        }
    }

    if [signal] {
        ruby {
            path => "/etc/logstash/scripts/signal_redis_streamer.rb"
            script_params => {
                "enabled" => true
                "address" => "10.0.5.97:6379"
                "username" => ""
                "password" => ""
                "db" => 0
                "dial_timeout_seconds" => "5s"
                "read_timeout_seconds" => "3s"
                "write_timeout_seconds" => "3s"
                "stream_key" => "Rca:signalized_log_events"
                "max_len" => 100000
                "window_seconds" => 1800
                "trim_every_seconds" => 10
            }
        }
    }
}

output {
    if [ingest_pipeline] {
        elasticsearch {
            hosts => ['http://10.0.5.60:9200']
            index => "linux-%{+YYYY.MM.dd}"
            document_id => "%{[source_rca_id]}"
            user => "elastic"
            password => "elastic"
            pipeline => "%{[ingest_pipeline]}"
        }
    } else {
        elasticsearch {
            hosts => ['http://10.0.5.60:9200']
            index => "linux-%{+YYYY.MM.dd}"
            document_id => "%{[source_rca_id]}"
            user => "elastic"
            password => "elastic"
        }
    }
}
