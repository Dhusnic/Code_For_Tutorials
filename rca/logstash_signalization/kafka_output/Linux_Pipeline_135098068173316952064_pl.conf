input {
    pipeline {
        address => "linux_pipeline_135098068173316952064"
    }
}

filter {
    ruby {
        init => 'require "securerandom"'
        code => '
            source_rca_id = event.get("source_rca_id")
            if source_rca_id.nil? || source_rca_id.to_s.strip.empty?
                event.set("source_rca_id", SecureRandom.uuid)
            end
        '
    }

    mutate {
        add_field => {
            "[event][child_pipeline]" => "135098106316384636928"
            "source_rca_index" => "linux-%{+YYYY.MM.dd}"
        }
    }
}

output {
    kafka {
        bootstrap_servers => "10.0.4.203:9092"
        topic_id => "linux-logs"

        security_protocol => "SASL_SSL"
        sasl_mechanism => "SCRAM-SHA-512"
        sasl_jaas_config => 'org.apache.kafka.common.security.scram.ScramLoginModule required username="infraon-producer" password="infraon@123";'

        ssl_truststore_location => "/opt/environments/kafka.truststore.jks"
        ssl_truststore_password => "changeit"
        ssl_endpoint_identification_algorithm => ""

        codec => json
    }

    if [ingest_pipeline] {
        elasticsearch {
            hosts => ["http://10.0.5.60:9200"]
            index => "linux-%{+YYYY.MM.dd}"
            document_id => "%{[source_rca_id]}"
            user => "elastic"
            password => "elastic"
            pipeline => "%{[ingest_pipeline]}"
        }
    } else {
        elasticsearch {
            hosts => ["http://10.0.5.60:9200"]
            index => "linux-%{+YYYY.MM.dd}"
            document_id => "%{[source_rca_id]}"
            user => "elastic"
            password => "elastic"
        }
    }
}
