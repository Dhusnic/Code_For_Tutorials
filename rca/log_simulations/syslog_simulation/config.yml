syslog_simulator:
  # Vendor/device allowlists.
  # Remove these keys or set them to null to allow everything from defaults.json.
  # Available vendors in defaults.json:
  # - cisco_ios
  # - juniper_srx
  # - fortigate
  # - paloalto
  # - f5_bigip
  # - checkpoint
  # - arista_eos
  # - hpe_aruba
  # - huawei_vrp
  # - dell_os10
  # - crontab_cron
  # - mikrotik_ros
  enabled_vendors:
    - "cisco_ios"
    # - "juniper_srx"
    # - "fortigate"
    # - "paloalto"
    # - "f5_bigip"
    # - "checkpoint"
    # - "arista_eos"
    # - "hpe_aruba"
    # - "huawei_vrp"
    # - "dell_os10"
    # - "crontab_cron"
    # - "mikrotik_ros"

  # Available devices in defaults.json:
  # - cisco-switch-1        (vendor=cisco_ios, category=switch)
  # - cisco-router-1        (vendor=cisco_ios, category=router)
  # - juniper-srx-1         (vendor=juniper_srx, category=firewall)
  # - fortigate-1           (vendor=fortigate, category=security-appliance)
  # - paloalto-1            (vendor=paloalto, category=firewall)
  # - f5-1                  (vendor=f5_bigip, category=loadbalancer)
  # - checkpoint-1          (vendor=checkpoint, category=security-appliance)
  # - arista-1              (vendor=arista_eos, category=switch)
  # - huawei-ce-leaf-1      (vendor=huawei_vrp, category=switch)
  # - huawei-ce-spine-1     (vendor=huawei_vrp, category=switch)
  # - huawei-ne-edge-1      (vendor=huawei_vrp, category=router)
  # - hpe-aruba-cx-leaf-1   (vendor=hpe_aruba, category=switch)
  # - hpe-aruba-cx-spine-1  (vendor=hpe_aruba, category=switch)
  # - hpe-aruba-aoss-edge-1 (vendor=hpe_aruba, category=router)
  # - dell-os10-leaf-1      (vendor=dell_os10, category=switch)
  # - dell-os10-spine-1     (vendor=dell_os10, category=switch)
  # - dell-os10-border-1    (vendor=dell_os10, category=router)
  # - dell-os10-cron-1      (vendor=crontab_cron, category=other)
  # - dell-os10-cron-2      (vendor=crontab_cron, category=other)
  # - mikrotik-1            (vendor=mikrotik_ros, category=router)
  # - mikrotik-ap-1         (vendor=mikrotik_ros, category=wireless)
  enabled_devices:
    - "cisco-switch-1"
    - "cisco-router-1"
    # - "juniper-srx-1"
    # - "fortigate-1"
    # - "paloalto-1"
    # - "f5-1"
    # - "checkpoint-1"
    # - "arista-1"
    # - "huawei-ce-leaf-1"
    # - "huawei-ce-spine-1"
    # - "huawei-ne-edge-1"
    # - "hpe-aruba-cx-leaf-1"
    # - "hpe-aruba-cx-spine-1"
    # - "hpe-aruba-aoss-edge-1"
    # - "dell-os10-leaf-1"
    # - "dell-os10-spine-1"
    # - "dell-os10-border-1"
    # - "dell-os10-cron-1"
    # - "dell-os10-cron-2"
    # - "mikrotik-1"
    # - "mikrotik-ap-1"

