[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logs-only-investigator"
version = "0.2.0"
description = "Signal-first RCA investigator with LangGraph tools, thread memory, and checkpointed chat state."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9.1.3,<10.0",
  "langgraph>=0.2.60,<0.3.0",
  "openai>=1.0,<2.0",
  "pymongo>=4.0,<5.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
rag-build = [
  "chromadb>=0.5,<1.0",
  "sentence-transformers>=3.0,<4.0",
]
ui = [
  "plotly>=5.24,<6.0",
  "streamlit>=1.38,<2.0",
]

[project.scripts]
logs-investigator = "logs_only_investigator.main:main"
logs-investigator-rebuild-rag = "logs_only_investigator.rebuild_rag:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
