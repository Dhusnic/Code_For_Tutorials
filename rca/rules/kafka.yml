service: kafka
rules:
  - id: KAFKA_SASL_AUTH_FAILED
    signal_key: sasl_auth
    level: critical
    description: SASL authentication failed (error code 58 / auth handshake failure).
    tags: [security, sasl, auth]
    condition:
      or:
        - field: error_code
          op: equals
          value: 58
        - field: code
          op: equals
          value: 58
        - field: kafka.error_code
          op: equals
          value: 58
        - field: message
          op: regex
          value: '(SASL_AUTHENTICATION_FAILED|SASL authentication failed|Authentication failed during authentication)'

  - id: KAFKA_ILLEGAL_SASL_STATE
    signal_key: sasl_state
    level: warning
    description: SASL flow is invalid for current handshake state (error code 34).
    tags: [security, sasl, protocol]
    condition:
      or:
        - field: error_code
          op: equals
          value: 34
        - field: code
          op: equals
          value: 34
        - field: message
          op: regex
          value: '(ILLEGAL_SASL_STATE|Request is not valid given the current SASL state)'

  - id: KAFKA_UNSUPPORTED_SASL_MECHANISM
    signal_key: sasl_mechanism
    level: warning
    description: Requested SASL mechanism is not enabled on broker (error code 33).
    tags: [security, sasl, config]
    condition:
      or:
        - field: error_code
          op: equals
          value: 33
        - field: code
          op: equals
          value: 33
        - field: message
          op: regex
          value: '(UNSUPPORTED_SASL_MECHANISM|Unsupported SASL mechanism)'

  - id: KAFKA_SSL_HANDSHAKE_FAILED
    signal_key: ssl_handshake
    level: critical
    description: TLS/SSL handshake failure on broker listener or inter-broker channel.
    tags: [security, tls, network]
    condition:
      or:
        - field: message
          op: regex
          value: '(SSL handshake failed|TLS handshake failed|SslAuthenticationException)'
        - field: msg
          op: regex
          value: '(SSL handshake failed|TLS handshake failed|SslAuthenticationException)'

  - id: KAFKA_TOPIC_AUTH_FAILED
    signal_key: topic_auth
    level: warning
    description: Topic authorization failure (error code 29).
    tags: [security, acl, topic]
    condition:
      or:
        - field: error_code
          op: equals
          value: 29
        - field: code
          op: equals
          value: 29
        - field: message
          op: contains
          value: TOPIC_AUTHORIZATION_FAILED

  - id: KAFKA_GROUP_AUTH_FAILED
    signal_key: group_auth
    level: warning
    description: Consumer group authorization failure (error code 30).
    tags: [security, acl, group]
    condition:
      or:
        - field: error_code
          op: equals
          value: 30
        - field: code
          op: equals
          value: 30
        - field: message
          op: contains
          value: GROUP_AUTHORIZATION_FAILED

  - id: KAFKA_CLUSTER_AUTH_FAILED
    signal_key: cluster_auth
    level: warning
    description: Cluster-level authorization failure (error code 31).
    tags: [security, acl, cluster]
    condition:
      or:
        - field: error_code
          op: equals
          value: 31
        - field: code
          op: equals
          value: 31
        - field: message
          op: contains
          value: CLUSTER_AUTHORIZATION_FAILED

  - id: KAFKA_TXID_AUTH_FAILED
    signal_key: txid_auth
    level: warning
    description: Transactional ID authorization failure (error code 53).
    tags: [security, acl, transaction]
    condition:
      or:
        - field: error_code
          op: equals
          value: 53
        - field: code
          op: equals
          value: 53
        - field: message
          op: contains
          value: TRANSACTIONAL_ID_AUTHORIZATION_FAILED

  - id: KAFKA_UNKNOWN_TOPIC_PARTITION
    signal_key: topic_unknown
    level: warning
    description: Requested topic-partition is unknown on broker (error code 3).
    tags: [metadata, topic, partition]
    condition:
      or:
        - field: error_code
          op: equals
          value: 3
        - field: code
          op: equals
          value: 3
        - field: message
          op: contains
          value: UNKNOWN_TOPIC_OR_PARTITION

  - id: KAFKA_LEADER_NOT_AVAILABLE
    signal_key: leader_missing
    level: warning
    description: Leader currently unavailable during election/reassignment (error code 5).
    tags: [leader, election, availability]
    condition:
      or:
        - field: error_code
          op: equals
          value: 5
        - field: code
          op: equals
          value: 5
        - field: message
          op: contains
          value: LEADER_NOT_AVAILABLE

  - id: KAFKA_NOT_LEADER_OR_FOLLOWER
    signal_key: role_mismatch
    level: warning
    description: Request was sent to broker that is neither current leader nor follower (error code 6).
    tags: [leader, routing, metadata]
    condition:
      or:
        - field: error_code
          op: equals
          value: 6
        - field: code
          op: equals
          value: 6
        - field: message
          op: regex
          value: '(NOT_LEADER_OR_FOLLOWER|NOT_LEADER_FOR_PARTITION)'

  - id: KAFKA_BROKER_NOT_AVAILABLE
    signal_key: broker_down
    level: critical
    description: Broker is unavailable (error code 8).
    tags: [broker, availability, cluster]
    condition:
      or:
        - field: error_code
          op: equals
          value: 8
        - field: code
          op: equals
          value: 8
        - field: message
          op: contains
          value: BROKER_NOT_AVAILABLE

  - id: KAFKA_REPLICA_NOT_AVAILABLE
    signal_key: replica_down
    level: warning
    description: Replica unavailable for requested partition (error code 9).
    tags: [replication, replica, availability]
    condition:
      or:
        - field: error_code
          op: equals
          value: 9
        - field: code
          op: equals
          value: 9
        - field: message
          op: contains
          value: REPLICA_NOT_AVAILABLE

  - id: KAFKA_COORDINATOR_NOT_AVAILABLE
    signal_key: coord_down
    level: warning
    description: Group/transaction coordinator unavailable (error code 15).
    tags: [coordinator, group, transaction]
    condition:
      or:
        - field: error_code
          op: equals
          value: 15
        - field: code
          op: equals
          value: 15
        - field: message
          op: contains
          value: COORDINATOR_NOT_AVAILABLE

  - id: KAFKA_NOT_COORDINATOR
    signal_key: coord_wrong
    level: warning
    description: Broker is not current coordinator for request (error code 16).
    tags: [coordinator, routing, group]
    condition:
      or:
        - field: error_code
          op: equals
          value: 16
        - field: code
          op: equals
          value: 16
        - field: message
          op: contains
          value: NOT_COORDINATOR

  - id: KAFKA_NETWORK_EXCEPTION
    signal_key: network_error
    level: warning
    description: Network exception between client-broker or broker-broker links (error code 13).
    tags: [network, io, connectivity]
    condition:
      or:
        - field: error_code
          op: equals
          value: 13
        - field: code
          op: equals
          value: 13
        - field: message
          op: regex
          value: '(NETWORK_EXCEPTION|Connection reset by peer|Broken pipe|Connection refused|timed out)'

  - id: KAFKA_REQUEST_TIMED_OUT
    signal_key: request_timeout
    level: warning
    description: Kafka request timed out before completion (error code 7).
    tags: [timeout, request, latency]
    condition:
      or:
        - field: error_code
          op: equals
          value: 7
        - field: code
          op: equals
          value: 7
        - field: message
          op: contains
          value: REQUEST_TIMED_OUT

  - id: KAFKA_NOT_ENOUGH_REPLICAS
    signal_key: replicas_low
    level: critical
    description: Insufficient in-sync replicas for write acknowledgments (error code 19).
    tags: [replication, isr, durability]
    condition:
      or:
        - field: error_code
          op: equals
          value: 19
        - field: code
          op: equals
          value: 19
        - field: message
          op: contains
          value: NOT_ENOUGH_REPLICAS

  - id: KAFKA_NOT_ENOUGH_REPLICAS_APPEND
    signal_key: append_low
    level: critical
    description: Replicas dropped below required ACK count after append (error code 20).
    tags: [replication, isr, durability]
    condition:
      or:
        - field: error_code
          op: equals
          value: 20
        - field: code
          op: equals
          value: 20
        - field: message
          op: contains
          value: NOT_ENOUGH_REPLICAS_AFTER_APPEND

  - id: KAFKA_STORAGE_ERROR
    signal_key: storage_error
    level: critical
    description: Broker hit storage access error on log files (error code 56).
    tags: [storage, disk, broker]
    condition:
      or:
        - field: error_code
          op: equals
          value: 56
        - field: code
          op: equals
          value: 56
        - field: message
          op: contains
          value: KAFKA_STORAGE_ERROR

  - id: KAFKA_LOG_DIR_NOT_FOUND
    signal_key: logdir_missing
    level: critical
    description: Configured log directory missing/inaccessible (error code 57).
    tags: [storage, logdir, startup]
    condition:
      or:
        - field: error_code
          op: equals
          value: 57
        - field: code
          op: equals
          value: 57
        - field: message
          op: contains
          value: LOG_DIR_NOT_FOUND

  - id: KAFKA_OFFSET_OUT_OF_RANGE
    signal_key: offset_range
    level: warning
    description: Consumer requested offset outside retained range (error code 1).
    tags: [consumer, offset, retention]
    condition:
      or:
        - field: error_code
          op: equals
          value: 1
        - field: code
          op: equals
          value: 1
        - field: message
          op: contains
          value: OFFSET_OUT_OF_RANGE

  - id: KAFKA_OFFSET_NOT_AVAILABLE
    signal_key: offset_wait
    level: warning
    description: Requested offset is not yet available (error code 14).
    tags: [offset, replication, fetch]
    condition:
      or:
        - field: error_code
          op: equals
          value: 14
        - field: code
          op: equals
          value: 14
        - field: message
          op: contains
          value: OFFSET_NOT_AVAILABLE

  - id: KAFKA_CORRUPT_MESSAGE
    signal_key: message_corrupt
    level: critical
    description: Broker detected message corruption / checksum failure (error code 2).
    tags: [data, integrity, produce]
    condition:
      or:
        - field: error_code
          op: equals
          value: 2
        - field: code
          op: equals
          value: 2
        - field: message
          op: contains
          value: CORRUPT_MESSAGE

  - id: KAFKA_MESSAGE_TOO_LARGE
    signal_key: message_large
    level: warning
    description: Request/message exceeds configured max size (error code 10).
    tags: [produce, size, limits]
    condition:
      or:
        - field: error_code
          op: equals
          value: 10
        - field: code
          op: equals
          value: 10
        - field: message
          op: contains
          value: MESSAGE_TOO_LARGE

  - id: KAFKA_INVALID_REPLICATION_FACTOR
    signal_key: repl_invalid
    level: warning
    description: Invalid replication factor in topic/create request (error code 38).
    tags: [topic, config, replication]
    condition:
      or:
        - field: error_code
          op: equals
          value: 38
        - field: code
          op: equals
          value: 38
        - field: message
          op: contains
          value: INVALID_REPLICATION_FACTOR

  - id: KAFKA_INVALID_REQUIRED_ACKS
    signal_key: acks_invalid
    level: warning
    description: Producer required acks value is invalid (error code 21).
    tags: [produce, config, acks]
    condition:
      or:
        - field: error_code
          op: equals
          value: 21
        - field: code
          op: equals
          value: 21
        - field: message
          op: contains
          value: INVALID_REQUIRED_ACKS

  - id: KAFKA_DISK_FULL
    signal_key: disk_full
    level: critical
    description: Disk full / filesystem write failure in broker runtime.
    tags: [storage, disk, capacity]
    condition:
      or:
        - field: message
          op: regex
          value: '(No space left on device|Disk full|Read-only file system)'
        - field: error.message
          op: regex
          value: '(No space left on device|Disk full|Read-only file system)'

  - id: KAFKA_TOO_MANY_OPEN_FILES
    signal_key: fd_exhausted
    level: critical
    description: OS file descriptor limits exhausted.
    tags: [os, file, capacity]
    condition:
      or:
        - field: message
          op: contains
          value: Too many open files
        - field: error.message
          op: contains
          value: Too many open files

  - id: KAFKA_JVM_OOM
    signal_key: jvm_oom
    level: critical
    description: JVM out-of-memory event observed.
    tags: [jvm, memory, process]
    condition:
      or:
        - field: message
          op: contains
          value: OutOfMemoryError
        - field: message
          op: contains
          value: Java heap space
        - field: message
          op: contains
          value: GC overhead limit exceeded

  - id: KAFKA_STARTUP_FATAL
    signal_key: startup_fatal
    level: critical
    description: Fatal startup exception prevented Kafka server boot.
    tags: [startup, fatal, broker]
    condition:
      or:
        - field: message
          op: contains
          value: Exiting Kafka due to fatal exception during startup
        - field: message
          op: contains
          value: Fatal error during KafkaServer startup
        - field: message
          op: contains
          value: Halting Kafka.

  - id: KAFKA_SERVICE_SHUTDOWN
    signal_key: service_down
    level: critical
    description: Broker process shutdown or termination event.
    tags: [service, lifecycle, availability]
    condition:
      or:
        - field: message
          op: regex
          value: '(shutting down|shutdown completed|Terminating|stopped \(kafka.server.KafkaServer\))'
        - field: msg
          op: regex
          value: '(shutting down|shutdown completed|Terminating|stopped \(kafka.server.KafkaServer\))'

  - id: KAFKA_UNDER_REPLICATED_PARTITIONS
    signal_key: under_replicated
    level: critical
    description: Under-replicated partitions metric is above zero.
    tags: [replication, isr, durability]
    condition:
      or:
        - field: kafka.metrics.replica_manager.under_replicated_partitions
          op: gt
          value: 0
        - field: kafka.server.ReplicaManager.UnderReplicatedPartitions
          op: gt
          value: 0
        - field: under_replicated_partitions
          op: gt
          value: 0

  - id: KAFKA_UNDER_MIN_ISR_PARTITIONS
    signal_key: minisr_low
    level: critical
    description: Partitions below min.insync.replicas threshold.
    tags: [replication, isr, durability]
    condition:
      or:
        - field: kafka.metrics.replica_manager.under_min_isr_partitions
          op: gt
          value: 0
        - field: kafka.server.ReplicaManager.UnderMinIsrPartitionCount
          op: gt
          value: 0
        - field: under_min_isr_partitions
          op: gt
          value: 0

  - id: KAFKA_OFFLINE_REPLICA_COUNT
    signal_key: replica_offline
    level: critical
    description: Offline replica count is above zero.
    tags: [replication, replica, availability]
    condition:
      or:
        - field: kafka.metrics.replica_manager.offline_replica_count
          op: gt
          value: 0
        - field: kafka.server.ReplicaManager.OfflineReplicaCount
          op: gt
          value: 0
        - field: offline_replica_count
          op: gt
          value: 0

  - id: KAFKA_ISR_SHRINK_RATE
    signal_key: isr_shrink
    level: warning
    description: ISR shrink events are occurring.
    tags: [replication, isr, stability]
    condition:
      or:
        - field: kafka.metrics.replica_manager.isr_shrinks_per_sec
          op: gt
          value: 0
        - field: kafka.server.ReplicaManager.IsrShrinksPerSec
          op: gt
          value: 0
        - field: isr_shrinks_per_sec
          op: gt
          value: 0

  - id: KAFKA_ACTIVE_CONTROLLER_INVALID
    signal_key: controller_fail
    level: critical
    description: Active controller count is not equal to one.
    tags: [controller, election, availability]
    condition:
      or:
        - field: kafka.metrics.controller.active_controller_count
          op: not_equals
          value: 1
        - field: kafka.controller.KafkaController.ActiveControllerCount
          op: not_equals
          value: 1
        - field: active_controller_count
          op: not_equals
          value: 1

  - id: KAFKA_REQUEST_HANDLER_IDLE_LOW
    signal_key: handler_busy
    level: warning
    description: Request handler idle percent is low (thread saturation risk).
    tags: [broker, threads, saturation]
    condition:
      or:
        - field: kafka.metrics.network.request_handler_avg_idle_percent
          op: lt
          value: 0.2
        - field: kafka.server.KafkaRequestHandlerPool.RequestHandlerAvgIdlePercent
          op: lt
          value: 0.2
        - field: request_handler_avg_idle_percent
          op: lt
          value: 0.2

  - id: KAFKA_KRAFT_NO_LEADER
    signal_key: raft_noleader
    level: critical
    description: KRaft quorum has no known leader.
    tags: [kraft, quorum, metadata]
    condition:
      or:
        - field: kafka.metrics.raft.current_leader
          op: equals
          value: -1
        - field: kafka.server.raft_metrics.current_leader
          op: equals
          value: -1
        - field: current_leader
          op: equals
          value: -1

  - id: KAFKA_KRAFT_UNATTACHED
    signal_key: raft_unattached
    level: warning
    description: KRaft node state is unattached/candidate and may be unstable.
    tags: [kraft, quorum, state]
    condition:
      or:
        - field: kafka.metrics.raft.current_state
          op: in
          value: [unattached, candidate]
        - field: kafka.server.raft_metrics.current_state
          op: in
          value: [unattached, candidate]
        - field: current_state
          op: in
          value: [unattached, candidate]

  - id: KAFKA_METADATA_LOAD_ERROR_COUNT
    signal_key: metadata_load
    level: critical
    description: Broker metadata listener encountered load errors.
    tags: [kraft, metadata, broker]
    condition:
      or:
        - field: kafka.metrics.broker_metadata.metadata_load_error_count
          op: gt
          value: 0
        - field: kafka.server.broker_metadata_metrics.MetadataLoadErrorCount
          op: gt
          value: 0
        - field: metadata_load_error_count
          op: gt
          value: 0

  - id: KAFKA_METADATA_APPLY_ERROR_COUNT
    signal_key: metadata_apply
    level: critical
    description: Broker metadata publisher encountered apply errors.
    tags: [kraft, metadata, broker]
    condition:
      or:
        - field: kafka.metrics.broker_metadata.metadata_apply_error_count
          op: gt
          value: 0
        - field: kafka.server.broker_metadata_metrics.MetadataApplyErrorCount
          op: gt
          value: 0
        - field: metadata_apply_error_count
          op: gt
          value: 0

  - id: KAFKA_CONTROLLER_EVENT_TIMEOUTS
    signal_key: event_timeout
    level: warning
    description: Controller event queue operations timed out.
    tags: [controller, queue, timeout]
    condition:
      or:
        - field: kafka.metrics.controller.event_queue_operations_timed_out_count
          op: gt
          value: 0
        - field: kafka.controller.KafkaController.EventQueueOperationsTimedOutCount
          op: gt
          value: 0
        - field: event_queue_operations_timed_out_count
          op: gt
          value: 0

  - id: KAFKA_OFFLINE_PARTITIONS_COUNT
    signal_key: partitions_offline
    level: critical
    description: One or more partitions are offline.
    tags: [partition, availability, cluster]
    condition:
      or:
        - field: kafka.metrics.controller.offline_partitions_count
          op: gt
          value: 0
        - field: kafka.controller.KafkaController.OfflinePartitionsCount
          op: gt
          value: 0
        - field: offline_partitions_count
          op: gt
          value: 0

  - id: KAFKA_UNCLEAN_LEADER_ELECTIONS
    signal_key: election_unclean
    level: critical
    description: Unclean leader elections occurred.
    tags: [leader, election, data]
    condition:
      or:
        - field: kafka.metrics.controller.unclean_leader_elections_per_sec
          op: gt
          value: 0
        - field: kafka.controller.ControllerStats.UncleanLeaderElectionsPerSec
          op: gt
          value: 0
        - field: unclean_leader_elections_per_sec
          op: gt
          value: 0

  - id: KAFKA_CONSUMER_LAG_HIGH
    signal_key: lag_high
    level: warning
    description: Consumer lag indicates delayed consumption.
    tags: [consumer, lag, performance]
    condition:
      or:
        - field: kafka.consumer_lag
          op: gte
          value: 100000
        - field: kafka.metrics.consumer.lag
          op: gte
          value: 100000
        - field: consumer_lag
          op: gte
          value: 100000

  - id: KAFKA_REBALANCE_STORM
    signal_key: rebalance_storm
    level: warning
    description: Excessive consumer group rebalance behavior observed.
    tags: [consumer, group, rebalance]
    condition:
      or:
        - field: message
          op: regex
          value: '(PreparingRebalance|CompletingRebalance|Stabilized group|Attempt to heartbeat failed since group is rebalancing)'
        - field: msg
          op: regex
          value: '(PreparingRebalance|CompletingRebalance|Stabilized group|Attempt to heartbeat failed since group is rebalancing)'
