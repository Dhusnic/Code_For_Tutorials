service: rabbitmq
rules:
- id: RABBITMQ_LEVEL_CRITICAL
  level: critical
  description: RabbitMQ log severity indicates critical failure.
  tags:
  - severity
  - critical
  - broker
  condition:
    or:
    # - field: log.level
    #   op: in
    #   value:
    #   - critical
    #   - crit
    #   - error
    #   - alert
    #   - emergency
    - field: level
      op: in
      value:
      - critical
      - crit
      - error
      - alert
      - emergency
    # - field: rabbitmq.log.level
    #   op: in
    #   value:
    #   - critical
    #   - crit
    #   - error
    #   - alert
    #   - emergency
    - field: message
      op: regex
      value: \b(CRITICAL|critical|ERROR|error|FATAL|fatal)\b
  signal_key: rabbitmq_level_critical


- id: RABBITMQ_LEVEL_WARNING
  level: warning
  description: RabbitMQ log severity indicates warning condition.
  tags:
  - severity
  - warning
  - broker
  condition:
    or:
    - field: log.level
      op: in
      value:
      - warning
      - warn
    - field: level
      op: in
      value:
      - warning
      - warn
    - field: rabbitmq.log.level
      op: in
      value:
      - warning
      - warn
    - field: message
      op: regex
      value: \b(WARNING|warning|WARN|warn)\b
  signal_key: rabbitmq_level_warning


- id: RABBITMQ_MEMORY_ALARM_SET
  level: critical
  description: Memory alarm raised on broker node.
  tags:
  - alarm
  - memory
  - flow_control
  condition:
    or:
    - field: message
      op: contains
      value: memory resource limit alarm set
    - field: message
      op: contains
      value: memory alarm
    - field: rabbitmq.node.mem.alarm
      op: equals
      value: true
  signal_key: rabbitmq_memory_alarm_set

- id: RABBITMQ_DISK_ALARM_SET
  level: critical
  description: Disk alarm raised due to low disk free space.
  tags:
  - alarm
  - disk
  - flow_control
  condition:
    or:
    - field: message
      op: contains
      value: disk resource limit alarm set
    - field: message
      op: contains
      value: disk free limit
    - field: rabbitmq.node.disk_free.alarm
      op: equals
      value: true
  signal_key: rabbitmq_disk_alarm_set
- id: RABBITMQ_ALARM_CLEARED
  level: warning
  description: Alarm cleared event after pressure period.
  tags:
  - alarm
  - recovery
  condition:
    or:
    - field: message
      op: contains
      value: resource limit alarm cleared
    - field: message
      op: contains
      value: alarm cleared
  signal_key: rabbitmq_alarm_cleared
- id: RABBITMQ_HEARTBEAT_MISSED
  level: critical
  description: Client heartbeat timeout detected.
  tags:
  - heartbeat
  - connection
  - timeout
  condition:
    or:
    - field: message
      op: contains
      value: missed heartbeats from client
    - field: message
      op: contains
      value: heartbeat timeout
    - field: message
      op: contains
      value: closing AMQP connection
  signal_key: rabbitmq_heartbeat_missed
- id: RABBITMQ_CONNECTION_CLOSED_UNEXPECTED
  level: warning
  description: AMQP connection closed unexpectedly or forcefully.
  tags:
  - connection
  - amqp
  condition:
    or:
    - field: message
      op: contains
      value: closing AMQP connection
    - field: message
      op: contains
      value: client unexpectedly closed TCP connection
    - field: message
      op: contains
      value: connection reset by peer
  signal_key: rabbitmq_connection_closed_unexpected
- id: RABBITMQ_CONNECTION_BLOCKED
  level: warning
  description: Connection blocked by broker flow control/alarm.
  tags:
  - connection
  - flow_control
  condition:
    or:
    - field: message
      op: contains
      value: connection blocked
    - field: rabbitmq.connection.state
      op: equals
      value: blocked
  signal_key: rabbitmq_connection_blocked
- id: RABBITMQ_AUTH_FAILED
  level: warning
  description: Authentication failure for RabbitMQ user/vhost.
  tags:
  - auth
  - security
  - login
  condition:
    or:
    - field: message
      op: contains
      value: authentication failure
    - field: message
      op: contains
      value: login was refused
    - field: message
      op: contains
      value: invalid credentials
  signal_key: rabbitmq_auth_failed
- id: RABBITMQ_ACCESS_REFUSED
  level: warning
  description: Authorization failure (permission denied or access refused).
  tags:
  - authz
  - security
  condition:
    or:
    - field: message
      op: contains
      value: access refused
    - field: message
      op: contains
      value: permission denied
    - field: message
      op: contains
      value: not allowed
  signal_key: rabbitmq_access_refused
- id: RABBITMQ_TLS_HANDSHAKE_FAILED
  level: critical
  description: TLS/SSL handshake failure for RabbitMQ listener.
  tags:
  - tls
  - ssl
  - handshake
  condition:
    or:
    - field: message
      op: contains
      value: TLS handshake failed
    - field: message
      op: contains
      value: SSL handshake failed
    - field: message
      op: contains
      value: ssl_handshake
  signal_key: rabbitmq_tls_handshake_failed
- id: RABBITMQ_TLS_CERT_ISSUE
  level: warning
  description: TLS certificate verification or trust issue.
  tags:
  - tls
  - certificate
  - security
  condition:
    or:
    - field: message
      op: contains
      value: certificate verify failed
    - field: message
      op: contains
      value: unknown ca
    - field: message
      op: contains
      value: bad certificate
  signal_key: rabbitmq_tls_cert_issue
- id: RABBITMQ_CLUSTER_PARTITION
  level: critical
  description: Cluster partition or node down event detected.
  tags:
  - cluster
  - partition
  - availability
  condition:
    or:
    - field: message
      op: regex
      value: cluster partition|partition handling|node .* down|nodedown
    - field: rabbitmq.cluster.partition_detected
      op: equals
      value: true
  signal_key: rabbitmq_cluster_partition
- id: RABBITMQ_MNESIA_OR_SCHEMA_FAILURE
  level: critical
  description: Mnesia/table/schema startup or sync error.
  tags:
  - cluster
  - mnesia
  - startup
  condition:
    or:
    - field: message
      op: contains
      value: mnesia
    - field: message
      op: contains
      value: schema
    - field: message
      op: contains
      value: table
  signal_key: rabbitmq_mnesia_or_schema_failure
- id: RABBITMQ_QUEUE_BACKLOG_HIGH
  level: warning
  description: Queue ready message depth exceeded threshold.
  tags:
  - queue
  - backlog
  - capacity
  condition:
    or:
    - field: rabbitmq.queue.messages.ready
      op: gte
      value: 10000
    - field: rabbitmq.queue.messages
      op: gte
      value: 20000
    - field: queue.messages.ready
      op: gte
      value: 10000
  signal_key: rabbitmq_queue_backlog_high
- id: RABBITMQ_UNACKED_MESSAGES_HIGH
  level: warning
  description: Unacked messages are high (consumer lag risk).
  tags:
  - queue
  - consumers
  - lag
  condition:
    or:
    - field: rabbitmq.queue.messages.unacknowledged
      op: gte
      value: 5000
    - field: queue.messages.unacknowledged
      op: gte
      value: 5000
  signal_key: rabbitmq_unacked_messages_high
- id: RABBITMQ_REDELIVER_RATE_HIGH
  level: warning
  description: Elevated redelivery count suggests processing instability.
  tags:
  - queue
  - redelivery
  condition:
    or:
    - field: rabbitmq.queue.message_stats.redeliver
      op: gte
      value: 1000
    - field: rabbitmq.queue.message_stats.redeliver_details.rate
      op: gte
      value: 50
  signal_key: rabbitmq_redeliver_rate_high
- id: RABBITMQ_CONSUMER_CAPACITY_LOW
  level: warning
  description: Queue consumer capacity indicates saturation.
  tags:
  - queue
  - consumers
  - saturation
  condition:
    or:
    - field: rabbitmq.queue.consumer_capacity
      op: lt
      value: 0.2
    - field: rabbitmq.queue.consumers
      op: equals
      value: 0
  signal_key: rabbitmq_consumer_capacity_low
- id: RABBITMQ_CHANNEL_OR_CONNECTION_MAX_REACHED
  level: warning
  description: Channel/connection count limits reached.
  tags:
  - limits
  - connections
  - channels
  condition:
    or:
    - field: message
      op: contains
      value: reached maximum number of channels
    - field: message
      op: contains
      value: cannot create channel
    - field: rabbitmq.node.channels
      op: gte
      value: 50000
  signal_key: rabbitmq_channel_or_connection_max_reached
- id: RABBITMQ_CHANNEL_EXCEPTION
  level: warning
  description: Channel exception indicates protocol or topology issue.
  tags:
  - channel
  - amqp
  - protocol
  condition:
    or:
    - field: message
      op: contains
      value: channel error
    - field: message
      op: contains
      value: precondition_failed
    - field: message
      op: contains
      value: not_found
  signal_key: rabbitmq_channel_exception
- id: RABBITMQ_QUEUE_EXCLUSIVE_LOCKED
  level: warning
  description: Queue/resource locked by exclusive use.
  tags:
  - queue
  - exclusive
  - lock
  condition:
    or:
    - field: message
      op: contains
      value: resource locked
    - field: message
      op: contains
      value: cannot obtain exclusive access
  signal_key: rabbitmq_queue_exclusive_locked
- id: RABBITMQ_MESSAGE_TOO_LARGE
  level: warning
  description: Message exceeded limits and was rejected.
  tags:
  - message
  - size
  - reject
  condition:
    or:
    - field: message
      op: contains
      value: frame too large
    - field: message
      op: contains
      value: message size
    - field: message
      op: contains
      value: max_message_size
  signal_key: rabbitmq_message_too_large
- id: RABBITMQ_DISK_SPACE_LOW_METRIC
  level: critical
  description: Node disk free metric below conservative threshold.
  tags:
  - disk
  - metric
  - capacity
  condition:
    or:
    - field: rabbitmq.node.disk_free
      op: lt
      value: 1000000000
    - field: rabbitmq.node.disk_free_limit
      op: gte
      value: 1000000000
  signal_key: rabbitmq_disk_space_low_metric
- id: RABBITMQ_MEMORY_USAGE_HIGH_METRIC
  level: critical
  description: RabbitMQ memory usage near/exceeding configured high watermark.
  tags:
  - memory
  - metric
  - capacity
  condition:
    or:
    - field: rabbitmq.node.mem.used
      op: gte
      value: 4000000000
    - field: rabbitmq.node.mem.limit
      op: lte
      value: 5000000000
  signal_key: rabbitmq_memory_usage_high_metric
- id: RABBITMQ_FILE_DESCRIPTORS_EXHAUSTION
  level: critical
  description: File descriptors near exhaustion.
  tags:
  - os
  - fd
  - capacity
  condition:
    or:
    - field: message
      op: contains
      value: too many open files
    - field: rabbitmq.node.fd_used
      op: gte
      value: 90000
  signal_key: rabbitmq_file_descriptors_exhaustion
- id: RABBITMQ_SOCKET_ERROR
  level: warning
  description: Socket-level network errors affecting clients or peers.
  tags:
  - network
  - socket
  condition:
    or:
    - field: message
      op: contains
      value: socket error
    - field: message
      op: contains
      value: econnreset
    - field: message
      op: contains
      value: etimedout
    - field: message
      op: contains
      value: connection refused
  signal_key: rabbitmq_socket_error
- id: RABBITMQ_PUBLISH_CONFIRM_TIMEOUT
  level: warning
  description: Publisher confirm/ack timeout pattern.
  tags:
  - publisher
  - confirm
  - timeout
  condition:
    or:
    - field: message
      op: contains
      value: confirm timeout
    - field: message
      op: contains
      value: publisher confirm
  signal_key: rabbitmq_publish_confirm_timeout
- id: RABBITMQ_DEAD_LETTER_ACTIVITY_HIGH
  level: warning
  description: Heavy dead-letter activity indicates downstream failures.
  tags:
  - dead_letter
  - reliability
  condition:
    or:
    - field: rabbitmq.queue.name
      op: regex
      value: (^dlq\.|\.dlq$|dead[-_]?letter)
    - field: rabbitmq.queue.messages.ready
      op: gte
      value: 1000
  signal_key: rabbitmq_dead_letter_activity_high
- id: RABBITMQ_SHOVEL_OR_FEDERATION_FAILURE
  level: warning
  description: Federation or shovel link failures.
  tags:
  - federation
  - shovel
  - integration
  condition:
    or:
    - field: message
      op: contains
      value: federation link
    - field: message
      op: contains
      value: shovel
    - field: message
      op: contains
      value: reconnect in
  signal_key: rabbitmq_shovel_or_federation_failure
- id: RABBITMQ_BOOT_FAILURE
  level: critical
  description: Broker startup/boot failure detected.
  tags:
  - startup
  - boot
  - availability
  condition:
    or:
    - field: message
      op: contains
      value: BOOT FAILED
    - field: message
      op: contains
      value: failed to start RabbitMQ
    - field: message
      op: contains
      value: application_controller
  signal_key: rabbitmq_boot_failure
- id: RABBITMQ_PLUGIN_OR_DEFINITION_LOAD_ERROR
  level: warning
  description: Plugin start/load or definitions import failure.
  tags:
  - plugin
  - definitions
  - config
  condition:
    or:
    - field: message
      op: contains
      value: failed to enable plugin
    - field: message
      op: contains
      value: definitions import
    - field: message
      op: contains
      value: error while loading definitions
  signal_key: rabbitmq_plugin_or_definition_load_error
- id: RABBITMQ_CLUSTER_SYNC_TIMEOUT
  level: warning
  description: Queue mirror/quorum/raft sync timeout or replication lag messages.
  tags:
  - cluster
  - replication
  - sync
  condition:
    or:
    - field: message
      op: regex
      value: sync|synchroni(z|s)e|quorum|raft|replica
    - field: message
      op: contains
      value: timeout
  signal_key: rabbitmq_cluster_sync_timeout
- id: RABBITMQ_SERVICE_MANAGER_FAILURE
  level: critical
  description: Service manager reports rabbitmq-server failed state/start failure.
  tags:
  - service_manager
  - startup
  - availability
  condition:
    or:
    - field: message
      op: contains
      value: 'rabbitmq-server.service: Failed with result'
    - field: message
      op: contains
      value: Unit rabbitmq-server.service entered failed state
    - field: message
      op: contains
      value: Failed to start RabbitMQ broker
  signal_key: rabbitmq_service_manager_failure
- id: RABBITMQ_LISTENER_BIND_PORT_CONFLICT
  level: critical
  description: RabbitMQ cannot bind AMQP/management listener (port in use).
  tags:
  - startup
  - listener
  - port_conflict
  condition:
    or:
    - field: message
      op: contains
      value: failed to start Ranch listener
    - field: message
      op: contains
      value: eaddrinuse
    - field: message
      op: contains
      value: address already in use
  signal_key: rabbitmq_listener_bind_port_conflict
- id: RABBITMQ_LISTENER_BIND_PERMISSION
  level: critical
  description: RabbitMQ cannot bind listener due to insufficient permissions.
  tags:
  - startup
  - listener
  - permission
  condition:
    or:
    - field: message
      op: contains
      value: failed to start Ranch listener
    - field: message
      op: contains
      value: eacces
    - field: message
      op: contains
      value: permission denied
  signal_key: rabbitmq_listener_bind_permission
- id: RABBITMQ_ERLANG_COOKIE_MISMATCH
  level: critical
  description: Erlang cookie authentication mismatch blocks inter-node communication.
  tags:
  - cluster
  - auth
  - cookie
  condition:
    or:
    - field: message
      op: contains
      value: Invalid challenge reply
    - field: message
      op: contains
      value: Connection attempt from disallowed node
    - field: message
      op: contains
      value: Erlang cookie
  signal_key: rabbitmq_erlang_cookie_mismatch
- id: RABBITMQ_ERLANG_DISTRIBUTION_DOWN
  level: critical
  description: Erlang distribution channel failure can isolate node/cluster.
  tags:
  - cluster
  - distribution
  - availability
  condition:
    or:
    - field: message
      op: contains
      value: distribution port
    - field: message
      op: contains
      value: epmd error
    - field: message
      op: contains
      value: net_kernel
  signal_key: rabbitmq_erlang_distribution_down
- id: RABBITMQ_CLUSTER_PEER_UNREACHABLE
  level: critical
  description: Cluster peer unreachable due to network/DNS issues.
  tags:
  - cluster
  - network
  - peer_unreachable
  condition:
    or:
    - field: message
      op: contains
      value: nodedown
    - field: message
      op: contains
      value: pang
    - field: message
      op: contains
      value: timeout contacting cluster nodes
    - field: message
      op: contains
      value: name or service not known
  signal_key: rabbitmq_cluster_peer_unreachable
- id: RABBITMQ_BLOCKED_CONNECTIONS_PERSISTENT
  level: critical
  description: Connections remain blocked under sustained resource pressure.
  tags:
  - flow_control
  - blocked
  - pressure
  condition:
    or:
    - field: rabbitmq.connections.blocked
      op: gte
      value: 100
    - field: message
      op: contains
      value: blocking connection
    - field: message
      op: contains
      value: flow control
  signal_key: rabbitmq_blocked_connections_persistent
- id: RABBITMQ_VM_OR_ERLANG_CRASH
  level: critical
  description: Erlang VM crash or panic-level broker failure.
  tags:
  - runtime
  - erlang
  - crash
  condition:
    or:
    - field: message
      op: contains
      value: Kernel pid terminated
    - field: message
      op: contains
      value: init terminating in do_boot
    - field: message
      op: contains
      value: CRASH REPORT
  signal_key: rabbitmq_vm_or_erlang_crash
