service: auth
rules:
  - id: AUTH_LEVEL_CRITICAL
    signal_key: level_critical
    level: critical
    description: Authentication log severity indicates critical or higher condition.
    tags: [severity, critical, auth]
    condition:
      or:
        - field: log.level
          op: in
          value: [emerg, emergency, alert, crit, critical, err, error, fatal, panic]
        - field: level
          op: in
          value: [emerg, emergency, alert, crit, critical, err, error, fatal, panic]
        - field: PRIORITY
          op: in
          value: [0, 1, 2, 3, "0", "1", "2", "3"]

  - id: AUTH_LEVEL_WARNING
    signal_key: level_warning
    level: warning
    description: Authentication log severity indicates warning condition.
    tags: [severity, warning, auth]
    condition:
      or:
        - field: log.level
          op: in
          value: [warn, warning]
        - field: level
          op: in
          value: [warn, warning]
        - field: PRIORITY
          op: in
          value: [4, "4"]

  - id: AUTH_SSH_PASSWORD_FAIL
    signal_key: ssh_fail
    level: warning
    description: OpenSSH password authentication failed.
    tags: [ssh, auth, failure]
    condition:
      and:
        - or:
            - field: process.name
              op: in
              value: [sshd]
            - field: system.auth.ssh.event
              op: exists
        - or:
            - field: system.auth.ssh.event
              op: equals
              value: Failed
            - field: message
              op: regex
              value: 'Failed password for( invalid user)? .+ from .+'
            - field: system.auth.message
              op: regex
              value: 'Failed password for( invalid user)? .+ from .+'

  - id: AUTH_SSH_INVALID_USER
    signal_key: ssh_user
    level: warning
    description: OpenSSH authentication attempt for invalid user.
    tags: [ssh, auth, account]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: sshd
            - field: system.auth.ssh.event
              op: exists
        - or:
            - field: system.auth.ssh.event
              op: equals
              value: Invalid
            - field: message
              op: regex
              value: 'Invalid user .+ from .+'
            - field: system.auth.message
              op: regex
              value: 'Invalid user .+ from .+'

  - id: AUTH_SSH_ROOT_DENIED
    signal_key: ssh_root
    level: warning
    description: Root SSH login attempt blocked by server policy.
    tags: [ssh, auth, policy]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: sshd
            - field: system.auth.message
              op: exists
        - or:
            - field: message
              op: regex
              value: '(ROOT LOGIN REFUSED|root login attempt denied|not allowed because not listed in AllowUsers|not allowed because listed in DenyUsers|PermitRootLogin)'
            - field: system.auth.message
              op: regex
              value: '(ROOT LOGIN REFUSED|root login attempt denied|not allowed because not listed in AllowUsers|not allowed because listed in DenyUsers|PermitRootLogin)'

  - id: AUTH_SSH_BRUTE_FORCE
    signal_key: ssh_brute
    level: critical
    description: SSH brute-force indicators such as repeated failures or preauth disconnect thresholds.
    tags: [ssh, auth, brute]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: sshd
            - field: system.auth.message
              op: exists
        - or:
            - field: message
              op: regex
              value: '(maximum authentication attempts exceeded|Too many authentication failures|Received disconnect from .* Too many authentication failures|beginning MaxStartups throttling|drop connection #)'
            - field: system.auth.message
              op: regex
              value: '(maximum authentication attempts exceeded|Too many authentication failures|Received disconnect from .* Too many authentication failures|beginning MaxStartups throttling|drop connection #)'

  - id: AUTH_SSH_PUBLICKEY_FAIL
    signal_key: ssh_key
    level: warning
    description: SSH public key authentication rejected.
    tags: [ssh, auth, publickey]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: sshd
            - field: system.auth.message
              op: exists
        - or:
            - field: system.auth.ssh.method
              op: equals
              value: publickey
            - field: message
              op: regex
              value: '(Failed publickey for|Authentication refused: bad ownership or modes for|Authentication refused: bad ownership or modes for directory)'
            - field: system.auth.message
              op: regex
              value: '(Failed publickey for|Authentication refused: bad ownership or modes for|Authentication refused: bad ownership or modes for directory)'

  - id: AUTH_SSH_KEX_FAIL
    signal_key: ssh_kex
    level: warning
    description: SSH key exchange or cipher negotiation failed.
    tags: [ssh, crypto, negotiation]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: sshd
            - field: system.auth.message
              op: exists
        - or:
            - field: message
              op: regex
              value: '(Unable to negotiate with .* no matching (key exchange method|cipher found|host key type found)|kex_exchange_identification)'
            - field: system.auth.message
              op: regex
              value: '(Unable to negotiate with .* no matching (key exchange method|cipher found|host key type found)|kex_exchange_identification)'

  - id: AUTH_SSH_DNS_SPOOF
    signal_key: ssh_spoof
    level: warning
    description: SSH reverse DNS mismatch or spoofing warning.
    tags: [ssh, dns, spoof]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: sshd
            - field: system.auth.message
              op: exists
        - or:
            - field: message
              op: regex
              value: '(POSSIBLE DNS SPOOFING DETECTED|POSSIBLE BREAK-IN ATTEMPT|Address .* maps to .* but this does not map back to the address)'
            - field: system.auth.message
              op: regex
              value: '(POSSIBLE DNS SPOOFING DETECTED|POSSIBLE BREAK-IN ATTEMPT|Address .* maps to .* but this does not map back to the address)'

  - id: AUTH_PAM_AUTH_FAIL
    signal_key: pam_fail
    level: warning
    description: PAM authentication failure across sshd/sudo/login stacks.
    tags: [pam, auth, failure]
    condition:
      or:
        - field: message
          op: regex
          value: '(pam_[a-z0-9_]+\\(.*\\): authentication failure|pam_[a-z0-9_]+\\(.*\\): auth could not identify password|PAM .* authentication error)'
        - field: system.auth.message
          op: regex
          value: '(pam_[a-z0-9_]+\\(.*\\): authentication failure|pam_[a-z0-9_]+\\(.*\\): auth could not identify password|PAM .* authentication error)'

  - id: AUTH_PAM_ACCOUNT_FAIL
    signal_key: pam_acct
    level: warning
    description: PAM account policy failure (expired/locked/invalid account).
    tags: [pam, account, policy]
    condition:
      or:
        - field: message
          op: regex
          value: '(pam_[a-z0-9_]+\\(.*\\): account (expired|locked|not available)|PAM account management error|User account has expired)'
        - field: system.auth.message
          op: regex
          value: '(pam_[a-z0-9_]+\\(.*\\): account (expired|locked|not available)|PAM account management error|User account has expired)'

  - id: AUTH_PAM_SESSION_FAIL
    signal_key: pam_sess
    level: warning
    description: PAM session open/close failed.
    tags: [pam, session, failure]
    condition:
      or:
        - field: message
          op: regex
          value: '(pam_[a-z0-9_]+\\(.*\\): cannot (open|close) session|session open failed|session denied)'
        - field: system.auth.message
          op: regex
          value: '(pam_[a-z0-9_]+\\(.*\\): cannot (open|close) session|session open failed|session denied)'

  - id: AUTH_PAM_CRED_FAIL
    signal_key: pam_cred
    level: warning
    description: PAM credential setup/refresh failed.
    tags: [pam, credential, failure]
    condition:
      or:
        - field: message
          op: regex
          value: '(pam_[a-z0-9_]+\\(.*\\): setcred failed|credential(s)? .* (failed|invalid|expired)|PAM setcred error)'
        - field: system.auth.message
          op: regex
          value: '(pam_[a-z0-9_]+\\(.*\\): setcred failed|credential(s)? .* (failed|invalid|expired)|PAM setcred error)'

  - id: AUTH_PAM_FAILLOCK
    signal_key: pam_lock
    level: warning
    description: pam_faillock indicates account lockout after repeated failures.
    tags: [pam, lockout, auth]
    condition:
      or:
        - field: message
          op: regex
          value: '(pam_faillock\\(.*\\): (Consecutive login failures|User .* is locked)|faillock.*(locked|failures))'
        - field: system.auth.message
          op: regex
          value: '(pam_faillock\\(.*\\): (Consecutive login failures|User .* is locked)|faillock.*(locked|failures))'

  - id: AUTH_PAM_ACCESS_DENIED
    signal_key: pam_deny
    level: warning
    description: PAM access policy denied login.
    tags: [pam, access, denial]
    condition:
      or:
        - field: message
          op: regex
          value: '(pam_access\\(.*\\): access denied|pam_succeed_if\\(.*\\): requirement .* not met|PAM.*Permission denied)'
        - field: system.auth.message
          op: regex
          value: '(pam_access\\(.*\\): access denied|pam_succeed_if\\(.*\\): requirement .* not met|PAM.*Permission denied)'

  - id: AUTH_PAM_MODULE_ERROR
    signal_key: pam_error
    level: critical
    description: PAM stack misconfiguration or module initialization error.
    tags: [pam, config, error]
    condition:
      or:
        - field: message
          op: regex
          value: '(PAM \\(.*\\) illegal module type|PAM unable to dlopen\\(.*\\)|Module is unknown|PAM adding faulty module)'
        - field: system.auth.message
          op: regex
          value: '(PAM \\(.*\\) illegal module type|PAM unable to dlopen\\(.*\\)|Module is unknown|PAM adding faulty module)'

  - id: AUTH_SUDO_DENIED
    signal_key: sudo_deny
    level: warning
    description: sudo authorization denied by sudoers policy.
    tags: [sudo, authz, denial]
    condition:
      or:
        - field: system.auth.sudo.error
          op: exists
        - field: message
          op: regex
          value: '(user NOT in sudoers|is not in the sudoers file|command not allowed|not allowed to execute)'
        - field: system.auth.message
          op: regex
          value: '(user NOT in sudoers|is not in the sudoers file|command not allowed|not allowed to execute)'

  - id: AUTH_SUDO_AUTH_FAIL
    signal_key: sudo_auth
    level: warning
    description: sudo password authentication failed.
    tags: [sudo, auth, failure]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: sudo
            - field: system.auth.message
              op: exists
        - or:
            - field: message
              op: regex
              value: '(sudo: .*authentication failure|incorrect password attempts|[0-9]+ incorrect password attempt)'
            - field: system.auth.message
              op: regex
              value: '(sudo: .*authentication failure|incorrect password attempts|[0-9]+ incorrect password attempt)'

  - id: AUTH_SUDO_PLUGIN_ERROR
    signal_key: sudo_error
    level: critical
    description: sudo policy/plugin/parsing failure blocks authorization flow.
    tags: [sudo, config, failure]
    condition:
      or:
        - field: message
          op: regex
          value: '(unable to initialize policy plugin|parse error in /etc/sudoers|no valid sudoers sources found|unable to load /etc/sudoers)'
        - field: system.auth.message
          op: regex
          value: '(unable to initialize policy plugin|parse error in /etc/sudoers|no valid sudoers sources found|unable to load /etc/sudoers)'

  - id: AUTH_SU_FAILED
    signal_key: su_fail
    level: warning
    description: su authentication failure.
    tags: [su, auth, failure]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: su
            - field: system.auth.message
              op: exists
        - or:
            - field: message
              op: regex
              value: '(FAILED SU|su: Authentication failure|su: incorrect password attempt)'
            - field: system.auth.message
              op: regex
              value: '(FAILED SU|su: Authentication failure|su: incorrect password attempt)'

  - id: AUTH_SU_ROOT_DENIED
    signal_key: su_root
    level: critical
    description: Failed su attempt specifically targeting root account.
    tags: [su, auth, root]
    condition:
      and:
        - or:
            - field: process.name
              op: equals
              value: su
            - field: system.auth.message
              op: exists
        - or:
            - field: message
              op: regex
              value: '(FAILED SU .* to root|authentication failure.* user=root)'
            - field: system.auth.message
              op: regex
              value: '(FAILED SU .* to root|authentication failure.* user=root)'

  - id: AUTH_PKEXEC_DENIED
    signal_key: pke_deny
    level: warning
    description: pkexec/polkit authorization denied.
    tags: [polkit, pkexec, denial]
    condition:
      and:
        - or:
            - field: process.name
              op: in
              value: [pkexec, polkitd]
            - field: message
              op: contains
              value: polkit
        - or:
            - field: message
              op: regex
              value: '(Not authorized|authorization denied|Authentication failure)'
            - field: system.auth.message
              op: regex
              value: '(Not authorized|authorization denied|Authentication failure)'

  - id: AUTH_ACCOUNT_LOCKED
    signal_key: acct_lock
    level: warning
    description: User account locked or disabled by authentication stack.
    tags: [account, lockout, auth]
    condition:
      or:
        - field: message
          op: regex
          value: '(account is locked|User account is locked|Account locked|authentication failure.*locked)'
        - field: system.auth.message
          op: regex
          value: '(account is locked|User account is locked|Account locked|authentication failure.*locked)'

  - id: AUTH_ACCOUNT_EXPIRED
    signal_key: acct_expire
    level: warning
    description: Account expired and login denied.
    tags: [account, expiry, policy]
    condition:
      or:
        - field: message
          op: regex
          value: '(account expired|User account has expired|Account has expired)'
        - field: system.auth.message
          op: regex
          value: '(account expired|User account has expired|Account has expired)'

  - id: AUTH_PASSWORD_EXPIRED
    signal_key: pass_expire
    level: warning
    description: Password expired and requires reset before login.
    tags: [password, expiry, policy]
    condition:
      or:
        - field: message
          op: regex
          value: '(Password expired|password has expired|You are required to change your password immediately)'
        - field: system.auth.message
          op: regex
          value: '(Password expired|password has expired|You are required to change your password immediately)'

  - id: AUTH_PASSWORD_POLICY
    signal_key: pass_policy
    level: warning
    description: Password change rejected due to policy checks.
    tags: [password, policy, compliance]
    condition:
      or:
        - field: message
          op: regex
          value: '(BAD PASSWORD|password does not satisfy|password is too short|dictionary check failed|password reuse)'
        - field: system.auth.message
          op: regex
          value: '(BAD PASSWORD|password does not satisfy|password is too short|dictionary check failed|password reuse)'

  - id: AUTH_USER_ADDED
    signal_key: user_add
    level: info
    description: New local account creation detected.
    tags: [identity, user, create]
    condition:
      or:
        - field: message
          op: regex
          value: '(useradd\[[0-9]+\]: new user: name=|type=ADD_USER)'
        - field: system.auth.message
          op: regex
          value: '(useradd\[[0-9]+\]: new user: name=|type=ADD_USER)'
        - and:
            - field: audit.type
              op: equals
              value: ADD_USER
            - field: event.outcome
              op: in
              value: [success, unknown]

  - id: AUTH_USER_REMOVED
    signal_key: user_del
    level: warning
    description: Local account deletion detected.
    tags: [identity, user, delete]
    condition:
      or:
        - field: message
          op: regex
          value: '(userdel\[[0-9]+\]: delete user|type=DEL_USER)'
        - field: system.auth.message
          op: regex
          value: '(userdel\[[0-9]+\]: delete user|type=DEL_USER)'
        - and:
            - field: audit.type
              op: equals
              value: DEL_USER
            - field: event.outcome
              op: in
              value: [success, unknown]

  - id: AUTH_USER_MODIFIED
    signal_key: user_mod
    level: info
    description: User identity attributes or credentials modified.
    tags: [identity, user, modify]
    condition:
      or:
        - field: message
          op: regex
          value: '(usermod\[[0-9]+\]:|passwd\[[0-9]+\]: password changed for|type=CHUSER_ID)'
        - field: system.auth.message
          op: regex
          value: '(usermod\[[0-9]+\]:|passwd\[[0-9]+\]: password changed for|type=CHUSER_ID)'
        - and:
            - field: audit.type
              op: in
              value: [CHUSER_ID,USER_CHAUTHTOK]
            - field: event.outcome
              op: in
              value: [success, unknown]

  - id: AUTH_AUDIT_USER_AUTH_FAIL
    signal_key: audit_auth
    level: warning
    description: auditd user authentication failure event.
    tags: [auditd, auth, failure]
    condition:
      and:
        - or:
            - field: audit.type
              op: in
              value: [USER_AUTH, USER_LOGIN]
            - field: auditd.log.record_type
              op: in
              value: [USER_AUTH, USER_LOGIN]
            - field: message
              op: regex
              value: 'type=(USER_AUTH|USER_LOGIN)'
        - or:
            - field: event.outcome
              op: equals
              value: failure
            - field: message
              op: regex
              value: '(res=failed|op=PAM:authentication)'

  - id: AUTH_AUDIT_USER_ACCT_FAIL
    signal_key: audit_acct
    level: warning
    description: auditd account validation or credential event failed.
    tags: [auditd, account, failure]
    condition:
      and:
        - or:
            - field: audit.type
              op: in
              value: [USER_ACCT, CRED_ACQ, CRED_REFR, CRED_DISP]
            - field: auditd.log.record_type
              op: in
              value: [USER_ACCT, CRED_ACQ, CRED_REFR, CRED_DISP]
            - field: message
              op: regex
              value: 'type=(USER_ACCT|CRED_ACQ|CRED_REFR|CRED_DISP)'
        - or:
            - field: event.outcome
              op: equals
              value: failure
            - field: message
              op: contains
              value: res=failed

  - id: AUTH_AUDIT_ANOMALY
    signal_key: audit_anom
    level: critical
    description: auditd anomaly event indicates abnormal authentication/security behavior.
    tags: [auditd, anomaly, security]
    condition:
      or:
        - field: audit.type
          op: in
          value: [ANOM_LOGIN_FAILURES, ANOM_ABEND, ANOM_PROMISCUOUS, ANOM_ROOT_TRANS]
        - field: auditd.log.record_type
          op: in
          value: [ANOM_LOGIN_FAILURES, ANOM_ABEND, ANOM_PROMISCUOUS, ANOM_ROOT_TRANS]
        - field: message
          op: regex
          value: 'type=ANOM_'

  - id: AUTH_AUDIT_RESP_LOCK
    signal_key: audit_lock
    level: warning
    description: auditd active response locked account/access.
    tags: [auditd, response, lockout]
    condition:
      or:
        - field: audit.type
          op: in
          value: [RESP_ACCT_LOCK, RESP_TERM_ACCESS]
        - field: auditd.log.record_type
          op: in
          value: [RESP_ACCT_LOCK, RESP_TERM_ACCESS]
        - field: message
          op: regex
          value: 'type=(RESP_ACCT_LOCK|RESP_TERM_ACCESS)'

  - id: AUTH_AUDIT_MAC_DENIED
    signal_key: audit_mac
    level: warning
    description: MAC framework denial (SELinux AVC/AppArmor) tied to auth surface.
    tags: [auditd, mac, denial]
    condition:
      or:
        - field: message
          op: regex
          value: '(type=AVC.*denied|apparmor="DENIED"|avc: +denied)'
        - field: auditd.log.avc.action
          op: equals
          value: denied

  - id: AUTH_SSSD_AUTH_FAIL
    signal_key: sssd_fail
    level: warning
    description: SSSD/PAM-SSS authentication failed for centralized identity.
    tags: [sssd, auth, failure]
    condition:
      and:
        - or:
            - field: process.name
              op: in
              value: [sssd, sssd_pam, sssd_be]
            - field: message
              op: contains
              value: pam_sss
        - or:
            - field: message
              op: regex
              value: '(pam_sss\\(.*\\): authentication failure|Access denied for user|Authentication failed)'
            - field: system.auth.message
              op: regex
              value: '(pam_sss\\(.*\\): authentication failure|Access denied for user|Authentication failed)'

  - id: AUTH_SSSD_OFFLINE
    signal_key: sssd_offline
    level: warning
    description: SSSD backend/offline state can block authentication.
    tags: [sssd, backend, availability]
    condition:
      and:
        - or:
            - field: process.name
              op: in
              value: [sssd, sssd_be]
            - field: message
              op: contains
              value: sssd
        - or:
            - field: message
              op: regex
              value: '(Backend is offline|No available servers|Going offline|Unable to resolve host)'
            - field: system.auth.message
              op: regex
              value: '(Backend is offline|No available servers|Going offline|Unable to resolve host)'

  - id: AUTH_KRB5_PREAUTH_FAIL
    signal_key: krb_fail
    level: warning
    description: Kerberos/GSSAPI preauthentication or principal lookup failed.
    tags: [kerberos, gssapi, auth]
    condition:
      or:
        - field: message
          op: regex
          value: '(Preauthentication failed|Client not found in Kerberos database|Decrypt integrity check failed|gssapi-with-mic|krb5kdc)'
        - field: system.auth.message
          op: regex
          value: '(Preauthentication failed|Client not found in Kerberos database|Decrypt integrity check failed|gssapi-with-mic|krb5kdc)'

  - id: AUTH_LDAP_BIND_FAIL
    signal_key: ldap_fail
    level: warning
    description: LDAP bind/authentication failure affects login path.
    tags: [ldap, auth, directory]
    condition:
      or:
        - field: message
          op: regex
          value: '(ldap_(simple_)?bind.*(Invalid credentials|Can''t contact LDAP server|Server is unavailable)|pam_ldap.*Authentication failure)'
        - field: system.auth.message
          op: regex
          value: '(ldap_(simple_)?bind.*(Invalid credentials|Can''t contact LDAP server|Server is unavailable)|pam_ldap.*Authentication failure)'

  - id: AUTH_CONSOLE_LOGIN_FAIL
    signal_key: login_fail
    level: warning
    description: Console/getty/login program rejected user credentials.
    tags: [login, console, auth]
    condition:
      and:
        - or:
            - field: process.name
              op: in
              value: [login, agetty, systemd-logind]
            - field: message
              op: regex
              value: '(FAILED LOGIN|Login incorrect)'
        - or:
            - field: message
              op: regex
              value: '(FAILED LOGIN|Login incorrect|authentication failure)'
            - field: system.auth.message
              op: regex
              value: '(FAILED LOGIN|Login incorrect|authentication failure)'

  - id: AUTH_LOGIN_RATE_LIMIT
    signal_key: login_rate
    level: warning
    description: Login throttling or attempt-rate limit reached.
    tags: [login, rate, abuse]
    condition:
      or:
        - field: message
          op: regex
          value: '(Maximum number of login attempts exceeded|too many login failures|rate limit exceeded|throttling)'
        - field: system.auth.message
          op: regex
          value: '(Maximum number of login attempts exceeded|too many login failures|rate limit exceeded|throttling)'
