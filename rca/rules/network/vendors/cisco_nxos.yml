service: network
rules:
  - id: NETWORK_CISCO_NXOS_ETHPORT_DOWN
    signal_key: network_cisco_nxos_ethport_down
    level: critical
    description: Cisco NX-OS Ethernet port/link transitioned to down.
    tags: [vendor, cisco, nxos, physical, link]
    condition:
      or:
        - field: message
          op: regex
          value: '%ETHPORT-[0-9]-IF_(DOWN|ERROR)_.*'
        - field: msg
          op: regex
          value: '%ETHPORT-[0-9]-IF_(DOWN|ERROR)_.*'

  - id: NETWORK_CISCO_NXOS_VPC_SUSPEND
    signal_key: network_cisco_nxos_vpc_suspend
    level: critical
    description: Cisco NX-OS vPC suspended or degraded due to peer-state inconsistency.
    tags: [vendor, cisco, nxos, vpc, availability]
    condition:
      or:
        - field: message
          op: regex
          value: '%VPC-[0-9]-.*(SUSP|suspend|inconsistency|peer-link down)'
        - field: msg
          op: regex
          value: '%VPC-[0-9]-.*(SUSP|suspend|inconsistency|peer-link down)'

  - id: NETWORK_CISCO_NXOS_VPC_KEEPALIVE_DOWN
    signal_key: network_cisco_nxos_vpc_keepalive_down
    level: critical
    description: Cisco NX-OS vPC peer keepalive connectivity failed.
    tags: [vendor, cisco, nxos, vpc, availability]
    condition:
      or:
        - field: message
          op: regex
          value: '(peer-keepalive|PEER_KEEP_ALIVE).*(down|failed|lost|not reachable)'
        - field: msg
          op: regex
          value: '(peer-keepalive|PEER_KEEP_ALIVE).*(down|failed|lost|not reachable)'

  - id: NETWORK_CISCO_NXOS_BGP_ADJCHANGE_DOWN
    signal_key: network_cisco_nxos_bgp_adjchange_down
    level: critical
    description: Cisco NX-OS BGP adjacency changed to down state.
    tags: [vendor, cisco, nxos, bgp, control_plane]
    condition:
      or:
        - field: message
          op: regex
          value: '%BGP-[0-9]-ADJCHANGE:.*(Down|Idle|hold time expired|cease|reset)'
        - field: msg
          op: regex
          value: '%BGP-[0-9]-ADJCHANGE:.*(Down|Idle|hold time expired|cease|reset)'

  - id: NETWORK_CISCO_NXOS_OSPF_ADJCHANGE_DOWN
    signal_key: network_cisco_nxos_ospf_adjchange_down
    level: critical
    description: Cisco NX-OS OSPF adjacency changed to degraded/down state.
    tags: [vendor, cisco, nxos, ospf, control_plane]
    condition:
      or:
        - field: message
          op: regex
          value: '%OSPF-[0-9]-ADJCHG:.*(down|FULL to|LOADING to|EXSTART to|2WAY to)'
        - field: msg
          op: regex
          value: '%OSPF-[0-9]-ADJCHG:.*(down|FULL to|LOADING to|EXSTART to|2WAY to)'

  - id: NETWORK_CISCO_NXOS_NVE_PEER_DOWN
    signal_key: network_cisco_nxos_nve_peer_down
    level: critical
    description: Cisco NX-OS VXLAN NVE peer is down or unreachable.
    tags: [vendor, cisco, nxos, vxlan, nve]
    condition:
      and:
        - or:
            - field: message
              op: contains
              value: NVE
            - field: msg
              op: contains
              value: NVE
        - or:
            - field: message
              op: regex
              value: '(peer|vtep).*(down|unreachable|not reachable)'
            - field: msg
              op: regex
              value: '(peer|vtep).*(down|unreachable|not reachable)'

  - id: NETWORK_CISCO_NXOS_HSRP_DOWN
    signal_key: network_cisco_nxos_hsrp_down
    level: warning
    description: Cisco NX-OS HSRP/first-hop redundancy state degraded.
    tags: [vendor, cisco, nxos, hsrp, gateway]
    condition:
      or:
        - field: message
          op: regex
          value: '%HSRP-[0-9]-STATECHANGE:.*(Active -> Speak|Active -> Standby|down|Init)'
        - field: msg
          op: regex
          value: '%HSRP-[0-9]-STATECHANGE:.*(Active -> Speak|Active -> Standby|down|Init)'

  - id: NETWORK_CISCO_NXOS_CONFIG_CHANGE
    signal_key: network_cisco_nxos_config_change
    level: info
    description: Cisco NX-OS configuration change detected.
    tags: [vendor, cisco, nxos, config_change, audit]
    condition:
      or:
        - field: message
          op: regex
          value: '(VSHD_SYSLOG_CONFIG_I|configured from|copy running-config startup-config)'
        - field: msg
          op: regex
          value: '(VSHD_SYSLOG_CONFIG_I|configured from|copy running-config startup-config)'

  - id: NETWORK_CISCO_NXOS_HARDWARE_ALARM
    signal_key: network_cisco_nxos_hardware_alarm
    level: critical
    description: Cisco NX-OS hardware/environment alarm detected.
    tags: [vendor, cisco, nxos, hardware, thermal, power]
    condition:
      or:
        - field: message
          op: regex
          value: '%(MODULE|PLATFORM|PWR|THERMAL)-[0-9]-.*(fail|fault|alarm|shutdown|critical)'
        - field: msg
          op: regex
          value: '%(MODULE|PLATFORM|PWR|THERMAL)-[0-9]-.*(fail|fault|alarm|shutdown|critical)'
