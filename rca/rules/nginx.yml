service: nginx
rules:
- id: NGINX_LEVEL_CRITICAL
  level: critical
  description: NGINX error severity indicates critical failure (emerg, alert, crit,
    critical).
  tags:
  - severity
  - critical
  - core
  condition:
    or:
    - field: log.level
      op: in
      value:
      - emerg
      - alert
      - crit
      - critical
      - emergency
      - error
    - field: level
      op: in
      value:
      - emerg
      - alert
      - crit
      - critical
      - emergency
      - error
    - field: nginx.error.level
      op: in
      value:
      - emerg
      - alert
      - crit
      - critical
      - emergency
      - error
    - field: message
      op: regex
      value: \[emerg|alert|crit|critical|emergency|error\]
  signal_key: level_critical
- id: NGINX_LEVEL_WARNING
  level: warning
  description: NGINX error severity indicates warning conditions.
  tags:
  - severity
  - warning
  - core
  condition:
    or:
    - field: log.level
      op: in
      value:
      - warn
      - warning
    - field: level
      op: in
      value:
      - warn
      - warning
    - field: nginx.error.level
      op: in
      value:
      - warn
      - warning
    - field: message
      op: regex
      value: \[(warn|warning)\]
  signal_key: level_warning
- id: NGINX_UPSTREAM_TIMEOUT_CONNECT
  level: critical
  description: Timeout while connecting to upstream.
  tags:
  - upstream
  - timeout
  - connect
  condition:
    or:
    - field: message
      op: contains
      value: upstream timed out
    - field: message
      op: contains
      value: while connecting to upstream
  signal_key: upstream_timeout
- id: NGINX_UPSTREAM_TIMEOUT_READ_HEADER
  level: critical
  description: Timeout while reading response header from upstream.
  tags:
  - upstream
  - timeout
  - read_header
  condition:
    and:
    - field: message
      op: contains
      value: upstream timed out
    - field: message
      op: contains
      value: while reading response header from upstream
  signal_key: upstream_read
- id: NGINX_UPSTREAM_NO_LIVE
  level: critical
  description: No live upstream servers available.
  tags:
  - upstream
  - availability
  condition:
    or:
    - field: message
      op: contains
      value: no live upstreams
    - field: message
      op: contains
      value: no live upstreams while connecting to upstream
  signal_key: upstream_no
- id: NGINX_UPSTREAM_PREMATURE_CLOSE
  level: warning
  description: Upstream closed connection before full response.
  tags:
  - upstream
  - connection
  condition:
    or:
    - field: message
      op: contains
      value: upstream prematurely closed connection
    - field: message
      op: contains
      value: client prematurely closed connection, so upstream connection is closed
        too
  signal_key: upstream_premature
- id: NGINX_UPSTREAM_BIG_HEADER
  level: warning
  description: Upstream header larger than proxy buffer.
  tags:
  - upstream
  - header
  - buffer
  condition:
    field: message
    op: contains
    value: upstream sent too big header
  signal_key: upstream_big
- id: NGINX_UPSTREAM_CONTENT_LENGTH_MISMATCH
  level: warning
  description: Upstream sent more bytes than declared by Content-Length.
  tags:
  - upstream
  - protocol
  - content_length
  condition:
    field: message
    op: contains
    value: upstream sent more data than specified in "Content-Length" header
  signal_key: upstream_content
- id: NGINX_UPSTREAM_SERVER_TEMP_DISABLED
  level: warning
  description: Upstream peer was temporarily disabled after failures.
  tags:
  - upstream
  - failover
  - max_fails
  condition:
    field: message
    op: contains
    value: upstream server temporarily disabled
  signal_key: upstream_server
- id: NGINX_UPSTREAM_CONNECT_FAILED
  level: warning
  description: TCP connect to upstream failed.
  tags:
  - upstream
  - network
  - connect
  condition:
    or:
    - field: message
      op: contains
      value: connect() failed
    - field: message
      op: contains
      value: kevent() reported that connect() failed
  signal_key: upstream_connect
- id: NGINX_UPSTREAM_NAME_RESOLUTION
  level: warning
  description: Upstream name resolution or port declaration issue.
  tags:
  - upstream
  - dns
  - config
  condition:
    or:
    - field: message
      op: contains
      value: host not found in upstream
    - field: message
      op: contains
      value: no resolver defined to resolve
    - field: message
      op: contains
      value: no port in upstream
  signal_key: upstream_name
- id: NGINX_SSL_HANDSHAKE_FAILED
  level: critical
  description: TLS handshake failure observed.
  tags:
  - ssl
  - tls
  - handshake
  condition:
    or:
    - field: message
      op: contains
      value: SSL_do_handshake() failed
    - field: message
      op: contains
      value: peer closed connection in SSL handshake
    - field: message
      op: contains
      value: SSL handshaking to upstream
  signal_key: ssl_handshake
- id: NGINX_SSL_IO_FAILED
  level: warning
  description: TLS read/write operation failed.
  tags:
  - ssl
  - tls
  - io
  condition:
    or:
    - field: message
      op: contains
      value: SSL_read() failed
    - field: message
      op: contains
      value: SSL_write() failed
    - field: message
      op: contains
      value: SSL_set_session() failed
  signal_key: ssl_io
- id: NGINX_CLIENT_INVALID_REQUEST_LINE
  level: warning
  description: Malformed request line/method/version from client.
  tags:
  - client
  - protocol
  - bad_request
  condition:
    or:
    - field: message
      op: contains
      value: client sent invalid method
    - field: message
      op: contains
      value: client sent invalid request
    - field: message
      op: contains
      value: client sent invalid version
    - field: message
      op: contains
      value: client sent invalid method in HTTP/0.9 request
  signal_key: client_invalid
- id: NGINX_CLIENT_INVALID_HEADERS
  level: warning
  description: Malformed or invalid client header content.
  tags:
  - client
  - header
  - bad_request
  condition:
    or:
    - field: message
      op: contains
      value: client sent invalid host header
    - field: message
      op: contains
      value: client sent invalid "Content-Length" header
    - field: message
      op: contains
      value: client sent invalid header line
    - field: message
      op: contains
      value: client sent too long header line
  signal_key: client_headers
- id: NGINX_CLIENT_URI_TOO_LONG
  level: warning
  description: Client URI exceeded configured limit.
  tags:
  - client
  - uri
  - size
  condition:
    field: message
    op: contains
    value: client sent too long URI
  signal_key: client_uri
- id: NGINX_CLIENT_REQUEST_TOO_LARGE
  level: warning
  description: Client request headers exceeded buffer limits.
  tags:
  - client
  - size
  - header
  condition:
    or:
    - field: message
      op: contains
      value: client sent too large request
    - field: message
      op: contains
      value: too large header to copy
  signal_key: client_request
- id: NGINX_CLIENT_BODY_TOO_LARGE
  level: warning
  description: Client body exceeded allowed max body size.
  tags:
  - client
  - body
  - size
  condition:
    or:
    - field: message
      op: contains
      value: client intended to send too large body
    - field: message
      op: contains
      value: client intended to send too large chunked body
  signal_key: client_body
- id: NGINX_CLIENT_INVALID_CHUNKED_BODY
  level: warning
  description: Invalid chunked transfer body from client.
  tags:
  - client
  - chunked
  - bad_request
  condition:
    or:
    - field: message
      op: contains
      value: client sent invalid chunked body
    - field: message
      op: contains
      value: client sent too many chunk extensions
    - field: message
      op: contains
      value: client intended to send body data larger than declared
  signal_key: client_chunked
- id: NGINX_CLIENT_BODY_BUFFERED_TO_DISK
  level: warning
  description: Request body buffered to temporary file (possible disk pressure).
  tags:
  - client
  - buffering
  - disk
  condition:
    field: message
    op: contains
    value: a client request body is buffered to a temporary file
  signal_key: client_buffered
- id: NGINX_CLIENT_PREMATURE_CLOSE
  level: warning
  description: Client closed connection before response completed.
  tags:
  - client
  - disconnect
  condition:
    or:
    - field: message
      op: contains
      value: client prematurely closed connection
    - field: message
      op: contains
      value: client prematurely closed stream
  signal_key: client_premature
- id: NGINX_HTTP2_FLOOD
  level: critical
  description: HTTP/2 flood protection triggered.
  tags:
  - http2
  - flood
  - abuse
  condition:
    field: message
    op: contains
    value: http2 flood detected
  signal_key: http2_flood
- id: NGINX_HTTP2_HEADER_TOO_LARGE
  level: warning
  description: HTTP/2 header frame exceeded allowed size.
  tags:
  - http2
  - header
  - size
  condition:
    or:
    - field: message
      op: contains
      value: client sent too large header
    - field: message
      op: contains
      value: http2 preread buffer overflow
  signal_key: http2_header
- id: NGINX_OS_NO_SPACE
  level: critical
  description: Filesystem out of space while processing request/logging.
  tags:
  - os
  - disk
  - capacity
  condition:
    or:
    - field: message
      op: contains
      value: No space left on device
    - field: error.message
      op: contains
      value: No space left on device
  signal_key: os_no
- id: NGINX_OS_TOO_MANY_OPEN_FILES
  level: critical
  description: File descriptor exhaustion.
  tags:
  - os
  - file_descriptor
  - capacity
  condition:
    or:
    - field: message
      op: contains
      value: Too many open files
    - field: error.message
      op: contains
      value: Too many open files
  signal_key: os_too
- id: NGINX_OS_PERMISSION_DENIED
  level: warning
  description: Permission denied during file or socket operations.
  tags:
  - os
  - permission
  condition:
    or:
    - field: message
      op: contains
      value: Permission denied
    - field: error.message
      op: contains
      value: Permission denied
  signal_key: os_permission
- id: NGINX_ACCESS_5XX_ANY
  level: warning
  description: Any 5xx response in access logs.
  tags:
  - access
  - http_status
  - server_error
  condition:
    or:
    - field: http.response.status_code
      op: gte
      value: 500
    - field: status
      op: gte
      value: 500
  signal_key: access_5xx
- id: NGINX_ACCESS_502_BAD_GATEWAY
  level: critical
  description: Upstream gateway failure surfaced as 502.
  tags:
  - access
  - http_status
  - upstream
  condition:
    or:
    - field: http.response.status_code
      op: equals
      value: 502
    - field: status
      op: equals
      value: 502
  signal_key: access_bad
- id: NGINX_ACCESS_503_UNAVAILABLE
  level: critical
  description: Service unavailable response from proxy path.
  tags:
  - access
  - http_status
  - availability
  condition:
    or:
    - field: http.response.status_code
      op: equals
      value: 503
    - field: status
      op: equals
      value: 503
  signal_key: access_unavailable
- id: NGINX_ACCESS_504_TIMEOUT
  level: critical
  description: Gateway timeout response.
  tags:
  - access
  - http_status
  - timeout
  condition:
    or:
    - field: http.response.status_code
      op: equals
      value: 504
    - field: status
      op: equals
      value: 504
  signal_key: access_timeout
- id: NGINX_ACCESS_499_CLIENT_CLOSED
  level: warning
  description: Client disconnected before response completed (499).
  tags:
  - access
  - http_status
  - client_disconnect
  condition:
    or:
    - field: http.response.status_code
      op: equals
      value: 499
    - field: status
      op: equals
      value: 499
  signal_key: access_client
- id: NGINX_ACCESS_HIGH_REQUEST_TIME
  level: warning
  description: Request duration exceeded threshold.
  tags:
  - access
  - latency
  condition:
    or:
    - field: request_time
      op: gte
      value: 10
    - field: nginx.access.request_time
      op: gte
      value: 10
  signal_key: access_high
- id: NGINX_ACCESS_HIGH_UPSTREAM_TIME
  level: warning
  description: Upstream response duration exceeded threshold.
  tags:
  - access
  - upstream
  - latency
  condition:
    or:
    - field: upstream_response_time
      op: gte
      value: 10
    - field: nginx.access.upstream_response_time
      op: gte
      value: 10
  signal_key: access_upstream
- id: NGINX_ACCESS_REPEATED_4XX_EDGE
  level: warning
  description: Repeated edge client/protocol failures (400/408/414/431).
  tags:
  - access
  - http_status
  - edge
  condition:
    or:
    - field: http.response.status_code
      op: in
      value:
      - 400
      - 408
      - 414
      - 431
    - field: status
      op: in
      value:
      - 400
      - 408
      - 414
      - 431
  signal_key: access_repeated
- id: NGINX_WORKER_PROCESS_CRASH_SIGNAL
  level: critical
  description: Worker process exited unexpectedly on a signal.
  tags:
  - worker
  - process
  - crash
  condition:
    field: message
    op: regex
    value: worker process [0-9]+ exited on signal
  signal_key: worker_process
- id: NGINX_WORKER_RESPAWNED
  level: warning
  description: Worker process was respawned after abnormal termination.
  tags:
  - worker
  - process
  - lifecycle
  condition:
    or:
    - field: message
      op: contains
      value: worker process
    - field: message
      op: contains
      value: exited
  signal_key: worker_respawned
- id: NGINX_GATEWAY_PATH_ERRORS
  level: warning
  description: Common gateway path errors in proxy/FastCGI/UWSGI flows.
  tags:
  - gateway
  - proxy
  - backend
  condition:
    or:
    - field: message
      op: contains
      value: recv() failed
    - field: message
      op: contains
      value: readv() failed
    - field: message
      op: contains
      value: upstream sent invalid header
  signal_key: gateway_path
- id: NGINX_MISROUTED_HOST_OR_PORT
  level: warning
  description: Misrouted host/port configuration hints.
  tags:
  - routing
  - host
  - config
  condition:
    or:
    - field: message
      op: contains
      value: no host in upstream
    - field: message
      op: contains
      value: no port in upstream
    - field: message
      op: contains
      value: invalid host in request line
  signal_key: misrouted_host
- id: NGINX_STARTUP_CONFIG_TEST_FAILED
  level: critical
  description: NGINX failed to start due to invalid configuration.
  tags:
  - startup
  - config
  - availability
  condition:
    or:
    - field: message
      op: contains
      value: 'nginx: [emerg]'
    - field: message
      op: contains
      value: unknown directive
    - field: message
      op: contains
      value: invalid number of arguments in
    - field: message
      op: contains
      value: configuration file
  signal_key: startup_config
- id: NGINX_BIND_ADDRESS_IN_USE
  level: critical
  description: NGINX could not bind listen socket (port already in use).
  tags:
  - startup
  - socket
  - port_conflict
  condition:
    or:
    - field: message
      op: contains
      value: bind() to
    - field: message
      op: contains
      value: 'failed (98: Address already in use)'
    - field: message
      op: contains
      value: 'failed (10048: Only one usage of each socket address'
  signal_key: bind_address
- id: NGINX_BIND_PERMISSION_OR_PRIVILEGE
  level: critical
  description: NGINX could not bind/listen due to permissions.
  tags:
  - startup
  - socket
  - permission
  condition:
    or:
    - field: message
      op: contains
      value: bind() to
    - field: message
      op: contains
      value: Permission denied
  signal_key: bind_permission
- id: NGINX_LISTEN_SOCKET_SETUP_FAILED
  level: critical
  description: NGINX listen socket setup failed (service may not accept traffic).
  tags:
  - startup
  - socket
  - availability
  condition:
    or:
    - field: message
      op: contains
      value: listen() failed
    - field: message
      op: contains
      value: setsockopt(
    - field: message
      op: contains
      value: failed while setting up sockets
  signal_key: listen_socket
- id: NGINX_UPSTREAM_CONNECTION_REFUSED
  level: critical
  description: Upstream backend refused TCP connection.
  tags:
  - upstream
  - availability
  - backend_down
  condition:
    or:
    - field: message
      op: contains
      value: 'connect() failed (111: Connection refused)'
    - field: message
      op: contains
      value: 'connect() failed (10061: No connection could be made'
  signal_key: upstream_connection
- id: NGINX_UPSTREAM_HOST_UNREACHABLE
  level: critical
  description: Upstream host/network unreachable.
  tags:
  - upstream
  - network
  - backend_unreachable
  condition:
    or:
    - field: message
      op: contains
      value: 'connect() failed (113: No route to host)'
    - field: message
      op: contains
      value: 'connect() failed (110: Connection timed out)'
    - field: message
      op: contains
      value: Network is unreachable
  signal_key: upstream_host
- id: NGINX_RESOLVER_FAILURE_RUNTIME
  level: warning
  description: Runtime DNS resolution failed for upstream target.
  tags:
  - dns
  - resolver
  - upstream
  condition:
    or:
    - field: message
      op: contains
      value: could not be resolved
    - field: message
      op: contains
      value: resolver timed out
    - field: message
      op: contains
      value: no resolver defined to resolve
  signal_key: resolver_failure
- id: NGINX_MASTER_OR_WORKER_TERMINATION
  level: critical
  description: Master/worker termination indicating service instability or shutdown.
  tags:
  - process
  - service
  - lifecycle
  condition:
    or:
    - field: message
      op: contains
      value: worker process
    - field: message
      op: contains
      value: exited on signal
    - field: message
      op: contains
      value: master process
    - field: message
      op: contains
      value: exiting
  signal_key: master_or
- id: NGINX_SERVICE_MANAGER_FAILURE
  level: critical
  description: Service manager indicates nginx unit failed to start or stay active.
  tags:
  - service_manager
  - startup
  - availability
  condition:
    or:
    - field: message
      op: contains
      value: 'nginx.service: Failed with result'
    - field: message
      op: contains
      value: Failed to start A high performance web server and a reverse proxy server
    - field: message
      op: contains
      value: Unit nginx.service entered failed state
  signal_key: service_manager
