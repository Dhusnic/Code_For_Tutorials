elasticsearch:
  hosts:
    - "http://10.0.4.132:9200"
  username: "elastic"
  password: "elastic"
  verify_certs: false
  request_timeout_seconds: 30

checkpoints:
  provider: "elasticsearch"  # file | redis | postgres | elasticsearch
  path: "state/checkpoints.json"
  redis_url: null
  redis_prefix: "rca:checkpoint:"
  postgres_dsn: null
  postgres_table: "rca_checkpoints"
  elasticsearch_index: "rca-checkpoints"

logging:
  level: "INFO"
  json: true
  log_unmatched_events: false

rules_directory: "rules"

rule_learning:
  enabled: true
  mode: "suggest"  # suggest | append
  output_directory: "rules/suggestions"
  min_occurrences: 5
  max_candidates_per_service: 20
  min_keyword_count: 2
  max_keywords_per_signal: 4
  condition_field: "message"
  condition_op: "contains"
  level: "critical"

pipeline:
  batch_size: 2000
  worker_count: 1
  worker_id: 0
  bulk_worker_count: 4
  bulk_queue_size: 32
  batch_size_mode: "static"  # static | dynamic
  dynamic_batch_min_size: 500
  dynamic_batch_max_size: 10000
  dynamic_batch_lookback_seconds: 30
  dynamic_batch_target_window_seconds: 1.0
  dynamic_batch_smoothing_alpha: 0.5
  autoscaling_enabled: true
  autoscaling_target_events_per_worker_sec: 1500
  autoscaling_min_workers: 1
  autoscaling_max_workers: 64
  autoscaling_lag_scale_up_seconds: 60
  autoscaling_lag_scale_down_seconds: 10
  poll_interval_seconds: 10
  timestamp_field: "@timestamp"
  start_time: "now-15m"
  retry_max_attempts: 4
  retry_initial_backoff_seconds: 1.0
  retry_backoff_multiplier: 2.0
  signal_max_per_event: 2
  signal_select_highest_only: true
  source_indices:
    - "*"
  write_to_source_index: false
  write_to_target_index: true
  target_suffix: "-rca"
  dead_letter_suffix: "-rca-dead-letter"
  services:
    - name: "nginx"
      enabled: true
      rule_file: "services/nginx.yml"
      source_indices:
        - "*"
      start_time: "now-60m"
      query:
        term:
          event.module: "nginx"
    - name: "rabbitmq"
      enabled: true
      rule_file: "services/rabbitmq.yml"
      source_indices:
        - "*"
      start_time: "now-60m"
      query:
        term:
          event.module: "rabbitmq"
    - name: "mongodb"
      enabled: true
      rule_file: "services/mongodb.yml"
      source_indices:
        - "*"
      start_time: "now-60m"
      query:
        term:
          event.module: "mongodb"
    - name: "redis"
      enabled: true
      rule_file: "services/redis.yml"
      source_indices:
        - "*"
      start_time: "now-60m"
      query:
        term:
          event.module: "redis"
    - name: "kafka"
      enabled: true
      rule_file: "services/kafka.yml"
      source_indices:
        - "*"
      start_time: "now-60m"
      query:
        term:
          event.module: "kafka"
    - name: "postgres"
      enabled: true
      rule_file: "services/postgres.yml"
      source_indices:
        - "*"
      start_time: "now-60m"
      query:
        term:
          event.module: "postgresql"
    # - name: "system"
    #   enabled: true
    #   rule_file: "services/system.yml"
    #   source_indices:
    #     - "*"
    #   start_time: "now-60m"
    #   query:
    #     bool:
    #       should:
    #         - term:
    #             event.module: "system"
    #         - term:
    #             event.dataset: "system.syslog"
    #         - term:
    #             data_stream.dataset: "system.syslog"
    #       must_not:
    #         - term:
    #             event.dataset: "system.auth"
    #         - term:
    #             data_stream.dataset: "system.auth"
    #         - term:
    #             fileset.name: "auth"
    #         - wildcard:
    #             log.file.path: "*/auth.log*"
    #         - wildcard:
    #             log.file.path: "*/secure*"
    #       minimum_should_match: 1
    - name: "auth"
      enabled: true
      rule_file: "services/auth.yml"
      source_indices:
        - "*"
      start_time: "now-60m"
      query:
        bool:
          should:
            - term:
                event.dataset: "system.auth"
            - term:
                data_stream.dataset: "system.auth"
            - term:
                fileset.name: "auth"
            - wildcard:
                log.file.path: "*/auth.log*"
            - wildcard:
                log.file.path: "*/secure*"
          minimum_should_match: 1
    - name: "network"
      enabled: true
      rule_file: "services/network.yml"
      source_indices:
        - "network-*"
      start_time: "now-60m"
